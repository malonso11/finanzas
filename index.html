   <div class="acclist">${ACCS().map(a=>{ const n=S.rows.filter(r=>r.acc===a.id).length; return `<div class="accrow">${dot(accAbr(a.id),accColor(a.id))}<div style="flex:1;min-width:0"><b style="font-weight:600">${esc(a.name)}</b><div class="sub">${esc(bankOf(a.id).n)} · ${esc(a.kind||"Cuenta")} · ${n} movimientos${a.inactiva?" · sin actividad":""}${a.iban?` · <span class="code">${esc(fmtIban(a.iban).slice(0,4))} ··· ${esc(normIban(a.iban).slice(-4))}</span>`:""}</div></div>${(()=>{ const o=openingFor(a.id); return o?`<button class="btn sm" data-accopen="${esc(a.id)}" title="Añade un movimiento con el saldo que tenía la cuenta el ${fdate(o.f)}, antes del primer movimiento importado">Apertura ${eur(o.v)}</button>`:""; })()}<button class="btn sm" data-accedit="${esc(a.id)}">Editar</button>${n?"":`<button class="btn sm danger" data-accdel="${esc(a.id)}">Quitar</button>`}</div>`; }).join("")||`<p class="sub">Aún no hay cuentas.</p>`}</div></div>
  <div class="grid2">
   <div class="panel"><h3>Diccionario de comercios (${cf.merchants.length})</h3><p class="note">Para los pagos con tarjeta y los movimientos que el banco no categoriza: el primer texto que aparezca en la descripción gana, en este orden.</p>
    <div class="row"><input id="nm-k" placeholder="Texto clave, p. ej. HIPERBER" style="flex:1;min-width:150px"><select id="nm-c" style="flex:1;min-width:180px">${catSubOptions("",true)}</select><button class="btn" id="nm-add">Añadir</button></div>
    <div class="tbl-wrap tbl-fill"><table><tbody>${cf.merchants.map((m,i)=>`<tr><td class="code" style="color:var(--fg)">${esc(m.k)}</td><td class="sub">${esc(m.cat)} › ${esc(m.sub)}</td><td style="white-space:nowrap"><button class="btn sm" data-mup="${i}" title="Subir prioridad" aria-label="Subir">↑</button> <button class="btn sm danger" data-mdel="${i}" aria-label="Quitar">✕</button></td></tr>`).join("")}</tbody></table></div></div>
   <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
    <div class="panel"><h3>Tu nombre</h3><p class="note">Una transferencia a tu nombre, o a uno de los IBAN que pongas en tus cuentas (Cuentas y bancos › Editar), es un traspaso entre tus cuentas: no cuenta como gasto ni como ingreso. Pon el nombre tal como aparece en el banco; si la app la usa otra persona, el suyo.</p>
     <div class="chips">${cf.ownNames.map((n,i)=>isIban(n)?"":`<span class="chip">${esc(n)}<button data-odel="${i}" aria-label="Quitar">×</button></span>`).join("")||(ownNamesOnly().length?"":`<span class="pill p-warn">Sin nombre: los traspasos entre tus cuentas podrían contar como ingreso</span>`)}</div>
     <div class="row"><input id="no-n" placeholder="Nombre tal como aparece en el banco" style="flex:1"><button class="btn" id="no-add">Añadir</button></div>
     ${looseIbans().length?`<div class="note warn" style="display:flex;flex-direction:column;gap:8px"><span>IBAN guardados sin cuenta asignada: indica de qué cuenta es cada uno.</span>${looseIbans().map(n=>`<div class="row"><span class="code" style="color:var(--fg)">${esc(fmtIban(n))}</span><select data-ibsel="${esc(normIban(n))}" style="width:auto">${ACCS().filter(a=>!a.iban).map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join("")}</select><button class="btn sm" data-ibset="${esc(normIban(n))}">Asignar</button><button class="btn sm danger" data-ibdel="${esc(normIban(n))}">Quitar</button></div>`).join("")}</div>`:""}
     ${ACCS().some(a=>a.iban)?`<p class="sub" style="margin:0">IBAN y números de tus cuentas: ${ACCS().filter(a=>a.iban).map(a=>`${esc(accAbr(a.id))} ${esc(fmtIban(a.iban))}`).join(" · ")}</p>`:""}</div>
    <div class="panel"><h3>Personas conocidas (${cf.people.length})</h3><p class="note">Transferencias a estas personas: «Otros gastos / Transferencias».</p>
     <div class="chips">${cf.people.map((n,i)=>`<span class="chip">${esc(n)}<button data-pdel="${i}" aria-label="Quitar">×</button></span>`).join("")}</div>
     <div class="row"><input id="np-n" placeholder="Nombre" style="flex:1"><button class="btn" id="np-add">Añadir</button></div></div>
    <div class="panel"><h3>Alquiler pagado por adelantado</h3><p class="note">La primera transferencia por la cuota tras cobrar la nómina se imputa al mes siguiente. Sin importe configurado, se usa la subcategoría «Alquiler vivienda».</p>
     <div class="grid3"><label class="f"><span>Texto del casero</span><input id="alq-t" value="${esc(cf.alquiler.texto)}" placeholder="Opcional"></label><label class="f"><span>Cuota (€)</span><input type="number" id="alq-i" value="${cf.alquiler.importe??""}"></label><label class="f"><span>Tolerancia (€)</span><input type="number" id="alq-tol" value="${cf.alquiler.tol}"></label><label class="f"><span>Días máx. tras la nómina</span><input type="number" id="alq-d" value="${cf.alquiler.dias}"></label></div></div>
   </div>
  </div>
  <div class="panel"><h3>Correcciones de categoría del banco (${cf.ingFixes.length})</h3><p class="note">Se aplican siempre sobre la categoría que trae el banco cuando la descripción contiene el texto.</p>
   <div class="tbl-wrap"><table><thead><tr><th>Si la descripción contiene</th><th>Categoría correcta</th><th>Nota</th><th></th></tr></thead><tbody>${cf.ingFixes.map((x,i)=>`<tr><td class="code" style="color:var(--fg)">${esc(x.k)}</td><td>${esc(x.cat)} › ${esc(x.sub)}</td><td class="sub">${esc(x.nota)}</td><td><button class="btn sm danger" data-fdel="${i}" aria-label="Quitar">✕</button></td></tr>`).join("")}</tbody></table></div>
   ${(cf.bankMap||[]).length?`<h3>Categorías del banco reasignadas</h3><div class="tbl-wrap"><table><thead><tr><th>Si el banco dice</th><th>Categoría correcta</th><th></th></tr></thead><tbody>${cf.bankMap.map((x,i)=>`<tr><td class="code" style="color:var(--fg)">${esc(x.bcat)}${x.bsub?" › "+esc(x.bsub):""}</td><td>${esc(x.cat)} › ${esc(x.sub)}</td><td><button class="btn sm danger" data-bmdel="${i}" aria-label="Quitar">✕</button></td></tr>`).join("")}</tbody></table></div>`:""}
   <div class="row"><input id="nf-k" placeholder="Texto, p. ej. Catalanet 31 LUZ" style="flex:1;min-width:150px"><select id="nf-c" style="flex:1;min-width:180px">${catSubOptions("",true)}</select><input id="nf-n" placeholder="Nota" style="flex:1;min-width:120px"><button class="btn" id="nf-add">Añadir</button></div></div>
  <div class="panel"><h3>Categorías y subcategorías</h3><p class="note">Una subcategoría nueva suma al total de su categoría desde el primer momento. Renombrar actualiza las filas existentes. Solo se puede quitar una categoría o subcategoría sin movimientos ni reglas. Los colores siguen el orden fijo de la paleta; las categorías nuevas van en gris.</p>
   <p class="sub" style="margin:0">Arrastra una subcategoría a otra categoría para moverla con todos sus movimientos, o usa ⇄.</p>
   <div class="grid2">${cf.cats.map((c,ci)=>`<div class="catblock" data-dropcat="${ci}" style="display:flex;flex-direction:column;gap:6px;min-width:0"><div class="row"><button type="button" class="badgebtn" data-iedit="${ci}" aria-label="Editar icono de ${esc(c.n)}">${catBadge(c.n,"lg")}</button><b style="font-weight:600">${esc(c.n)}</b><span class="pill p-no">${tipoLbl[c.t]}</span><span class="spacer"></span>${PROTECTED_CATS.includes(c.n)?"":`<button class="btn sm danger" data-cdel="${ci}">Quitar categoría</button>`}</div>
     <div><button type="button" class="btn sm" data-iedit="${ci}">Editar icono</button></div>
     <div class="chips">${c.subs.map((s,si)=>{ const mov=!PROTECTED_SUBS.includes(s); return `<span class="chip${mov?" dragchip":""}"${mov?` draggable="true" data-dsub="${ci}|${si}" title="Arrastra para mover a otra categoría"`:""}>${mov?`<span class="grip" aria-hidden="true">⋮⋮</span>`:""}${esc(s)}${mov?`<button data-smove="${ci}|${si}" title="Mover a otra categoría" aria-label="Mover ${esc(s)} a otra categoría">⇄</button>`:""}<button data-srename="${ci}|${si}" title="Renombrar" aria-label="Renombrar">✎</button>${PROTECTED_SUBS.includes(s)?"":`<button data-sdel="${ci}|${si}" title="Quitar" aria-label="Quitar">×</button>`}</span>`; }).join("")}</div>
     <div class="row"><input id="ns-${ci}" placeholder="Nueva subcategoría" style="flex:1;min-width:140px"><button class="btn sm" data-sadd="${ci}">Añadir</button></div></div>`).join("")}</div>
   <div class="row"><button type="button" class="badgebtn" id="nc-icon" aria-label="Elegir icono de la nueva categoría">${badgeHTML((S.newCat||{}).icon||"tag",(S.newCat||{}).c||"gris",(S.newCat||{}).st,"lg")}</button><button type="button" class="btn sm" id="nc-icon2">Elegir icono</button><input id="nc-n" placeholder="Nueva categoría" style="flex:1;min-width:160px"><select id="nc-t" style="width:auto"><option value="gasto">Gasto</option><option value="ingreso">Ingreso</option></select><input id="nc-s" placeholder="Primera subcategoría" style="flex:1;min-width:160px"><button class="btn" id="nc-add">Añadir categoría</button></div></div>
  <details class="panel"${ACCS().some(a=>isTRacc(a.id))?"":" hidden"}><summary>Tipos de movimiento de ${esc((ACCS().find(a=>isTRacc(a.id))||{name:"tu bróker"}).name)} y su regla</summary><div class="kv" style="margin-top:8px">
   <dt>Transacción con tarjeta</dt><dd>Diccionario de comercios; si no hay coincidencia, Compras › Compras (otros)</dd>
   <dt>Operar</dt><dd>Ahorro e inversión › Aportación plan de ahorro (ETF); fondo identificado por el ISIN de la descripción y unidades leídas de «quantity:»</dd>
   <dt>Interés, Rentabilidad, Bonificación, Regalo</dt><dd>Otros ingresos › Rendimientos financieros</dd>
   <dt>Impuestos</dt><dd>Otros gastos › Pago de impuestos</dd>
   <dt>Recibos domiciliados</dt><dd>Compras › Tarjetas financieras y de crédito</dd>
   <dt>Transferencia</dt><dd>Corrección manual de la fila → tu nombre (traspaso) → persona conocida → entrante: Otros ingresos › Ingresos de otras entidades; saliente: Otros gastos › Transferencias (para revisar)</dd>
   <dt>Otro tipo</dt><dd>Otros gastos › Otros gastos (sin clasificar)</dd></div>
   <p class="note">Los tipos en inglés o alemán del export (Card Transaction, Trade, Transfer, Interest…) se normalizan a estos valores.</p></details>
  </section>`;
}

function vAyuda(){
  const ms=C().months;
  return `<section class="view guide">
  <div><h2>Ayuda y copias</h2></div>
  <div class="grid2">
   <div class="panel"><h3>Primeros pasos</h3><ol>
    <li>Da de alta tus cuentas con el asistente de inicio o en <b>Reglas › Cuentas y bancos</b>, con el IBAN de cada una, y añade en <b>Tu nombre</b> el nombre tal como aparece en las transferencias.</li>
    <li>En <b>Movimientos</b>, importa un extracto de cada cuenta (Excel, CSV o PDF, según lo que ofrezca tu banco). Si tienes una copia en Excel de esta herramienta, también se importa con sus categorías, meses, tipo de flujo y observaciones.</li>
    <li>Si quieres, crea el <b>asiento de apertura</b> de cada cuenta (Reglas › Cuentas y bancos) e indica en Reglas la cuota del alquiler.</li>
    <li>En <b>Patrimonio</b>, revisa el precio de cada fondo: aparecen solos por su ISIN al importar sus compras.</li>
    <li>Cada mes: importa los extractos nuevos, sigue la lista de <b>Revisión</b> y, al terminar, marca el mes como <b>Completo</b> en Resumen para ver su cierre.</li></ol></div>
   <div class="panel"><h3>Formatos que entiende</h3><ul>
    ${ACCS().filter(a=>!a.inactiva).map(a=>`<li><b>${esc(a.name)}</b>${lo(bankOf(a.id).n)!==lo(a.name)?` (${esc(bankOf(a.id).n)})`:""}: ${esc(bankHint(bankOf(a.id)))}</li>`).join("")}
    <li><b>${ACCS().length?"Cualquier otro banco":"Cualquier banco"}</b>: Excel o CSV con columnas de fecha, concepto e importe (y saldo si lo trae). Las columnas se detectan solas, en español o en inglés.</li>
    <li><b>PDF</b>: ${ACCS().some(a=>isTRacc(a.id))?`el extracto de ${esc(ACCS().filter(a=>isTRacc(a.id)).map(a=>a.name).join(", "))} se lee directamente; `:""}${sample?"el de otros bancos lo lee Claude y verás la cadena de saldos antes de importar.":"para otros bancos, descarga el extracto en Excel o CSV."}</li>
    <li>Si el archivo es de otra forma, corrige las columnas en la vista previa.</li></ul></div>
   <div class="panel"><h3>Exportar</h3>
    <div class="row"><button class="btn primary" id="exp-xlsx">Excel con todas las cuentas</button>${ACCS().map(a=>`<button class="btn" data-expacc="${esc(a.id)}">${esc(a.name)} (CSV)</button>`).join("")}</div>
    <p class="note">Mismas columnas que tus tablas, con Mes y Tipo de flujo ya calculados.</p>
    <div class="row"><button class="btn" id="exp-json">Copia completa (JSON)</button><label class="btn" for="imp-json">Restaurar copia JSON</label><input type="file" id="imp-json" accept=".json,application/json" hidden></div>
    <p class="note">Restaurar sustituye todos los movimientos y reglas.</p></div>
   <div class="panel"><h3>Empezar de cero</h3><p class="note">Borra todos los movimientos y tickets y vuelve a abrir el asistente para elegir tus bancos. Descarga antes una copia completa (JSON) si quieres conservar lo actual.</p>
    <label class="row" style="gap:8px;font-size:13px"><input type="checkbox" id="rs-keep" style="width:auto" checked> Conservar categorías, reglas, límites y apariencia</label>
    <div class="row"><input id="rs-word" placeholder="Escribe BORRAR para confirmar" style="max-width:260px" autocomplete="off"><button class="btn danger" id="rs-go">Empezar de cero</button></div></div>
   <div class="panel"><h3>Privacidad</h3><ul>
    <li>Los datos se guardan solo en este dispositivo, en el navegador: no se envían a ningún servidor. Haz una copia JSON de vez en cuando; si borras los datos del navegador o desinstalas la app, se pierden.</li>
    </ul>
    ${ms.length?`<h3>Borrar datos</h3><div class="row"><select id="del-acc" style="width:auto"><option value="">Todas las cuentas</option>${ACCS().map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join("")}</select><select id="del-m" style="width:auto"><option value="">Elige un mes…</option>${[...new Set(S.rows.map(r=>r.f.slice(0,7)))].sort().map(m=>`<option value="${m}">${mLabel(m)}</option>`).join("")}<option value="*">Todo</option></select><button class="btn danger" id="del-go">Borrar</button><span id="del-confirm"></span></div><p class="sub" style="margin:0">Por fecha real del movimiento.</p>`:""}</div>
  </div>
  
  </section>`;
}

/* =================== EDITOR DE FILA =================== */
function openRow(id){
  const r0=S.rows.find(x=>x.id===id); if(!r0) return;
  const r=structuredClone(r0);
  const ms=[]; for(let i=-2;i<=3;i++) ms.push(addMonths(r.f.slice(0,7),i));
  const root=document.getElementById("drawer-root");
  const parts=[];
  setTimeout(()=>{ drawAtts(id); bindAttInputs(id); },0);
  root.innerHTML=`<div class="drawer-bg" id="dbg"><form class="drawer" id="rf" aria-label="Editar movimiento">
   <div class="row"><h2>Movimiento</h2><span class="acc">${esc(accShort(r.acc))}</span><span class="spacer"></span><button type="button" class="btn" id="rf-x">Cerrar</button></div>
   <dl class="kv"><dt>Fecha</dt><dd>${fdate(r.f)}</dd><dt>Descripción</dt><dd>${esc(r.desc)}</dd>${r.tipo?`<dt>Tipo</dt><dd>${esc(r.tipo)}${r.tipoRaw&&r.tipoRaw!==r.tipo?` (${esc(r.tipoRaw)})`:""}</dd>`:""}<dt>Importe</dt><dd>${eur(r.imp)}</dd><dt>Saldo</dt><dd>${eur(r.saldo)}</dd>${r.bcat?`<dt>Categoría del banco</dt><dd>${esc(r.bcat)} › ${esc(r.bsub)}</dd>`:""}<dt>Origen de la categoría</dt><dd>${esc(SRC_LBL[r.src]||r.src)}${r.srcNote?" · "+esc(r.srcNote):""}</dd></dl>
   <label class="f"><span>Categoría › subcategoría</span><select id="rf-cat">${catSubOptions(r.cat+"|"+r.sub)}</select><small class="sub">Cambiarla aquí corrige el dato para siempre (origen «manual»).</small></label>
   ${r.src==="manual"?`<div><button type="button" class="btn sm" id="rf-auto">Volver a la categoría automática</button></div>`:""}
   ${r.src==="fallback"&&r.tipo==="Transacción con tarjeta"?`<label class="row" style="gap:6px;font-size:13px"><input type="checkbox" id="rf-dict" style="width:auto"> Añadir también al diccionario de comercios con el texto <input id="rf-dk" value="${esc(r.desc.replace(/\s+\d[\d\s]*$/,"").trim())}" style="max-width:220px"></label>`:""}
   <label class="f"><span>Comentario</span><input id="rf-com" value="${esc(r.com)}"></label>
   <label class="row" style="gap:8px;font-size:13px"><input type="checkbox" id="rf-extra" style="width:auto"${r.extra?" checked":""}> <span><b style="font-weight:600">Gasto extraordinario</b> <span class="sub">(puntual): se puede excluir de medias, límites, ahorro y previsión</span></span></label>
   <label class="f"><span>Observaciones</span><textarea id="rf-obs" placeholder="Nota tuya sobre esta fila (aparece en Revisión hasta que la marques como resuelta)">${esc(r.obs)}</textarea></label>
   <div class="grid3">
    <label class="f"><span>Mes contable</span><select id="rf-mes"><option value="">Automático (${r.f.slice(0,7)})</option>${ms.map(m=>`<option value="${m}"${r.mesOv===m?" selected":""}>${m}</option>`).join("")}</select><small class="sub">${r.mesSrc==="alquiler"?"Puesto por la regla de alquiler adelantado.":r.mesSrc==="maestro"?"Venía así en el Excel maestro.":"No cambia la fecha real."}</small></label>
    <label class="f"><span>Tipo de flujo</span><select id="rf-fl"><option value="">Automático (${r.imp>=0?"por signo":"Gasto"})</option><option value="Gasto"${r.flujoOv==="Gasto"?" selected":""}>Forzar Gasto (anula un gasto)</option></select><small class="sub">${r.flujoOv?esc(r.flujoNote||"Forzado"):"Para devoluciones que compensan un cargo."}</small></label>
    ${r.tipo==="Operar"?`<label class="f"><span>Unidades ETF</span><input type="number" step="0.000001" id="rf-u" value="${r.units??""}"></label><label class="f"><span>ISIN</span><input id="rf-isin" value="${esc(isinOf(r))}" maxlength="12" style="text-transform:uppercase"></label>`:""}
   </div>
   <fieldset><legend>Regla para los siguientes movimientos</legend>
    <p class="sub" style="margin:0">Los movimientos ${isTRacc(r.acc)?"con tarjeta ":""}de ${esc(accName(r.acc))} cuya descripción contenga este texto irán siempre a la categoría elegida. También se aplica a los que ya tienes, salvo los corregidos a mano.</p>
    <div class="row"><input id="rr-k" value="${esc(ruleText(r.desc))}" style="flex:1;min-width:150px" aria-label="Texto de la regla"><select id="rr-c" style="flex:1;min-width:200px" aria-label="Categoría de la regla">${catSubOptions(r.cat+"|"+r.sub)}</select><button type="button" class="btn sm" id="rr-go">Crear regla</button></div>
    <p class="sub" id="rr-n" style="margin:0"></p></fieldset>
   <fieldset><legend>Tickets y justificantes</legend>
    <div class="atts" id="rf-atts"></div>
    ${assets?`<div class="row"><label class="btn" for="rf-cam">${svgIcon("receipt",15)} Hacer foto</label><input type="file" id="rf-cam" accept="image/*" capture="environment" hidden><label class="btn" for="rf-file">Elegir archivo</label><input type="file" id="rf-file" accept="image/*,application/pdf" multiple hidden><span class="sub" id="rf-attst"></span></div><p class="sub" style="margin:0">Las fotos se reducen antes de guardarse y quedan en el almacenamiento privado de esta herramienta.</p>`:`<p class="sub" style="margin:0">Guarda la foto del ticket en tu galería y apunta en Comentario lo que necesites.</p>`}</fieldset>
   <fieldset><legend>Partir en varias filas</legend><p class="sub" style="margin:0">Mismo día; la última parte conserva el saldo real del extracto.</p><div id="rf-parts" style="display:flex;flex-direction:column;gap:6px"></div>
    <div class="row"><button type="button" class="btn sm" id="rf-padd">Añadir parte</button><span class="sub" id="rf-prest"></span></div></fieldset>
   ${(r.log||[]).length?`<details><summary class="sub">Historial de la fila</summary><div class="kv" style="margin-top:6px">${r.log.map(l=>`<dt>${fdate(l.d)}</dt><dd>${esc(l.t)}</dd>`).join("")}</div></details>`:""}
   <div class="row actions"><button type="button" class="btn danger" id="rf-del">Eliminar fila</button><span id="rf-delc"></span><span class="spacer"></span><button type="button" class="btn" id="rf-cancel">Cancelar</button><button type="submit" class="btn primary">Guardar</button></div>
  </form></div>`;
  const close=()=>{ root.innerHTML=""; render(); };
  const drawParts=()=>{ const el=document.getElementById("rf-parts"); el.innerHTML=parts.map((p,i)=>`<div class="row"><select data-pc="${i}" style="flex:2;min-width:180px">${catSubOptions(p.cs)}</select><input type="number" step="0.01" data-pi="${i}" value="${p.imp}" style="flex:1;min-width:90px"><button type="button" class="btn sm" data-pd="${i}" aria-label="Quitar">✕</button></div>`).join("");
    const rest=Math.round((r.imp-parts.reduce((a,p)=>a+(+p.imp||0),0))*100)/100;
    document.getElementById("rf-prest").textContent=parts.length?`Resto para la parte final (${r.cat} › ${r.sub}): ${eur(rest)}`:"";
    el.querySelectorAll("[data-pc]").forEach(s=>s.onchange=()=>parts[+s.dataset.pc].cs=s.value);

function doMoveSub(fromN,sub,toN){
  const cf=S.cfg;
  cf.cats=cf.cats.map(c=>c.n===fromN?Object.assign({},c,{subs:c.subs.filter(x=>x!==sub)}):c.n===toN&&!c.subs.includes(sub)?Object.assign({},c,{subs:c.subs.concat([sub])}):c);
  const fix=a=>a.map(x=>x.cat===fromN&&x.sub===sub?Object.assign({},x,{cat:toN}):x);
  cf.merchants=fix(cf.merchants); cf.ingFixes=fix(cf.ingFixes); cf.bankMap=fix(cf.bankMap||[]);
  const L=Object.assign({},cf.limits); if(L[fromN+"|"+sub]!=null){ L[toN+"|"+sub]=(L[toN+"|"+sub]||0)+L[fromN+"|"+sub]; delete L[fromN+"|"+sub]; } cf.limits=L;
  // recordar el traslado; si una subcategoría ya movida vuelve a moverse, se actualiza la cadena
  const M=Object.assign({},cf.subMoves||{});
  Object.keys(M).forEach(k=>{ if(k.split("|")[1]===sub&&M[k]===fromN) M[k]=toN; });
  M[fromN+"|"+sub]=toN; Object.keys(M).forEach(k=>{ if(k===toN+"|"+sub||M[k]===k.split("|")[0]) delete M[k]; });
  cf.subMoves=M;
  let n=0; S.rows.forEach(r=>{ if(r.cat===fromN&&r.sub===sub){ r.cat=toN; r.log=(r.log||[]).concat([{d:today(),t:`Subcategoría movida: ${fromN} › ${sub} → ${toN} › ${sub}`}]); n++; } });
  saveCfg(); autoAdjust(); invalidate(); commit(); render();
  toast(`«${sub}» movida a ${toN}${n?` · ${n} movimientos actualizados`:""}`);
}

function savePrice(id,p,d,fuente,nombre,extra){
  const c=Object.assign({},S.cfg.etfs[id]||{}); const prev=c.precio; c.precio=p; c.fechaNav=d; c.actualizado=today(); c.fuente=fuente; if(nombre&&!c.nombre) c.nombre=nombre; Object.assign(c,extra||{});

async function avCall(tool,input){
  const r=await mcp.callTool(AV,tool,Object.assign({datatype:"json"},input));
  let p=r&&r.payload; if(typeof p==="string"){ try{ p=JSON.parse(p); }catch(e){} }
  const er=p&&typeof p==="object"&&p.error;
  if(er) throw {code:/rate/i.test(er.type||"")?(/per second|1 request/i.test(er.message||"")?"av_burst":"av_day"):"av_msg",message:String(er.message||er.detail||er.type||"")};
  const msg=p&&typeof p==="object"&&(p.Information||p.Note||p["Error Message"]);
  if(msg) throw {code:/per second|1 request/i.test(msg)?"av_burst":/25 requests|per day|daily/i.test(msg)?"av_day":"av_msg",message:String(msg)};
  return p;
}
function mcpErrMsg(e){
  const c=e&&e.code;
  return c==="needs_reauth"||c==="server_not_connected"||c==="server_not_found"?"Conecta (o vuelve a autorizar) Alpha Vantage en claude.ai › Conectores.":
    c==="not_granted"||c==="consent_required"?"Sin permiso para usar Alpha Vantage desde la herramienta.":
    c==="rate_limited"?"Demasiadas consultas seguidas. Inténtalo en un rato.":
    c==="av_day"?"Alpha Vantage: has llegado al límite de 25 consultas diarias del plan gratuito; mañana se actualiza solo.":
    c==="av_burst"?"Alpha Vantage: demasiadas consultas seguidas; inténtalo en unos segundos.":
    c==="av_msg"?("Alpha Vantage: "+(/limit|frequency|25 requests/i.test(e.message)?"has llegado al límite de consultas del plan gratuito; inténtalo mañana.":e.message.slice(0,160))):
    "No se pudo consultar la cotización.";
}
async function updateQuotes(isins){
  if(!mcp||S.busy) return; if(!isins.length){ toast("No hay ETF con posición."); return; }
  let ok=0, msgs=[], warn=false;
  const wait=ms=>new Promise(r=>setTimeout(r,ms)); let first=true;
  for(const isin of isins){
    const sym=symbolFor(isin); if(!sym){ msgs.push(`Falta el código en bolsa de ${isin}: pulsa «Código» en su tarjeta.`); continue; }
    S.busy=`Consultando ${sym}…`; setStatus();
    try{
      // El plan gratuito admite 1 consulta por segundo: se espera entre una y otra y se reintenta una vez si aun así la rechaza
      if(!first) await wait(1300); first=false;
      let p; try{ p=await avCall("GLOBAL_QUOTE",{symbol:sym}); }catch(e1){ if(e1&&e1.code==="av_burst"){ await wait(2500); p=await avCall("GLOBAL_QUOTE",{symbol:sym}); } else throw e1; } const q=p&&p["Global Quote"]||{};
      const price=parseFloat(q["05. price"]), d=q["07. latest trading day"];
      if(!(price>0)||!/^\d{4}-\d{2}-\d{2}$/.test(d||"")){ msgs.push(`Alpha Vantage no devuelve precio para ${sym}.`); continue; }
      const prev=(S.cfg.etfs[isin]||{}).fechaNav;
      if(prev&&prev>d){ msgs.push(`${sym}: ya tenías un precio más reciente (${fdate(prev)}).`); continue; }
      if(savePrice(isin,Math.round(price*10000)/10000,d,`Alpha Vantage · ${symLabel(sym)}`,null,{symbol:sym,cambio:q["10. change percent"]||""})) warn=true;
      ok++;
    }catch(e){ msgs.push(mcpErrMsg(e)); if(e&&e.code!=="tool_error"&&e.code!=="av_msg"&&e.code!=="av_burst") break; }
  }
  if(ok&&!S.cfg.autoQuotes){ S.cfg.autoQuotes=true; saveCfg(); }
  S.busy=""; render();
  toast((ok?`${ok} ${ok===1?"cotización actualizada":"cotizaciones actualizadas"}${warn?". Ojo: alguna difiere más de un 15 % de la anterior":""}`:"")+(msgs.length?(ok?" · ":"")+msgs[0]:""));
}

async function shrinkImage(file){
  if(!/^image\/(jpeg|png|webp|heic|heif)/i.test(file.type||"")&&!/\.(heic|heif|jpe?g|png|webp)$/i.test(file.name||"")) return file;
  try{
    const bmp=await createImageBitmap(file); const max=1600, k=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k); c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(res=>c.toBlob(res,"image/jpeg",0.82));
    return blob&&blob.size<file.size?blob:file;
  }catch(e){ return file; }
}
async function addAttachments(id,files){
  const r=S.rows.find(x=>x.id===id); if(!r||!assets||!files.length) return;
  const st=document.getElementById("rf-attst"); let ok=0;
  for(const f of files){
    if(st) st.textContent=`Subiendo ${ok+1} de ${files.length}…`;
    try{
      const isPdf=/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name||"");
      const blob=isPdf?f:await shrinkImage(f);
      const type=isPdf?"application/pdf":(blob.type&&blob.type!=="image/heic"&&blob.type!=="image/heif"?blob.type:"image/jpeg");
      const res=await assets.upload(blob,{type});
      r.att=(r.att||[]).concat([{id:res.id,type:res.contentType||type,name:f.name||"ticket",added:today()}]); ok++;
    }catch(e){ const c=e&&e.code; toast(c==="too_large"?"El archivo es demasiado grande (máx. 20 MB).":c==="unsupported_type"?"Ese tipo de archivo no se puede adjuntar. Usa una foto o un PDF.":c==="rate_limited"?"Demasiadas subidas seguidas. Espera un momento.":"No se pudo subir el ticket."); }
  }
  if(ok){ r.log=(r.log||[]).concat([{d:today(),t:ok===1?"Ticket adjuntado":`${ok} tickets adjuntados`}]); invalidate(); commit(); toast(ok===1?"Ticket guardado":`${ok} tickets guardados`); }
  if(st) st.textContent=""; drawAtts(id);
}

// Comparte un adjunto con la hoja de compartir del móvil; si no se puede, lo descarga
async function shareAtt(src,name,type){
  try{ const b=await (await fetch(src)).blob(), pdf=/pdf/i.test(b.type||type||"");
    const f=new File([b],String(name||"ticket").replace(/\.\w+$/,"")+(pdf?".pdf":".jpg"),{type:b.type||type||"image/jpeg"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f]}); return; }
    await offer(f.name,f); }
  catch(e){ if(e&&e.name==="AbortError") return; toast("No se pudo compartir el ticket."); } }
function openLightbox(src,opt){
  const d=document.createElement("div"); d.className="lightbox"; d.setAttribute("role","dialog"); d.setAttribute("aria-label","Ticket");
  d.innerHTML=`<img src="${src}" alt="Ticket"><div class="row">${opt?`<button class="btn" type="button" data-lb="sh">Compartir</button>`:""}${opt&&opt.onDelete?`<button class="btn danger" type="button" data-lb="del">Eliminar</button>`:""}<a class="btn" href="${src}" target="_blank" rel="noopener">Abrir en otra pestaña</a><button class="btn" type="button" data-lb="x">Cerrar</button></div>`;
  d.onclick=async e=>{ const k=e.target.dataset&&e.target.dataset.lb;
    if(e.target===d||k==="x"){ d.remove(); return; }
    if(k==="sh"){ shareAtt(src,opt.name,opt.type); return; }
    if(k==="del"){ const b=e.target; if(!b.classList.contains("confirm")){ b.classList.add("confirm"); b.textContent="Confirmar eliminar"; return; } if(await opt.onDelete()) d.remove(); } };
  document.body.appendChild(d);
}

async function aiMerchants(){
  const um=Object.keys(reviewData().unknownMerchants).slice(0,60); if(!um.length||!sample) return;
  S.busy="Pidiendo sugerencias a Claude…"; render();
  try{
    const opts=S.cfg.cats.filter(c=>c.t==="gasto"||c.t==="ingreso").flatMap(c=>c.subs.map(s=>c.n+"|"+s));
    const res=await sample.json(`Eres un asistente que clasifica comercios de pagos con tarjeta en España (zona de Alicante y Elche). Para cada descripción elige la opción más probable de esta lista exacta (formato "Categoría|Subcategoría"):\n${opts.join("\n")}\n\nSi no puedes deducirlo con razonable seguridad, usa "".\nDescripciones:\n${JSON.stringify(um)}\n\nResponde solo con un objeto JSON {"descripción exacta":"Categoría|Subcategoría"}.`,{modelTier:"quick"});
    S.aiSug=Object.assign({},S.aiSug||{}); let n=0; for(const d of um){ const v=res&&res[d]; if(v&&opts.includes(v)){ S.aiSug[d]=v; n++; } }
    S.busy=""; render(); toast(`Claude ha sugerido ${n} de ${um.length}. Revisa y pulsa Añadir en cada uno.`);
  }catch(e){ S.busy=""; render(); toast(e&&e.code==="rate_limited"?"Demasiadas peticiones seguidas. Inténtalo en unos minutos.":"Claude no pudo sugerir categorías ahora."); }
}

async function handleFiles(files){
  const imgs=files.filter(isImgFile); if(imgs.length){ if(shotAvailable()) openShotReader(imgs); else toast("Para leer capturas abre la herramienta en claude.ai."); files=files.filter(f=>!isImgFile(f)); }
  const blocks=[];
  for(const f of files){ try{ blocks.push(...await readFile(f)); }catch(e){ console.error(e); toast(e&&e.message==="sin-tabla"?`«${f.name}»: no se encuentra una tabla con fecha, descripción e importe.`:`No se pudo leer «${f.name}».`); } }
  if(blocks.length){ S.pending=(S.pending||[]).concat(blocks); render(); }
}

// Pegar: archivos del portapapeles, celdas copiadas (texto con tabuladores) o texto libre de un PDF
function guessMapNoHeader(rows){
  const sample_=rows.slice(0,60), ncol=Math.max(...sample_.map(r=>r.length));
  const ratio=(i,fn)=>sample_.filter(r=>fn(r[i])!=null).length/Math.max(1,sample_.length);
  const map={}; let i;
  for(i=0;i<ncol;i++) if(ratio(i,parseDate)>.6){ map.fecha=i; break; }
  const nums=[]; for(i=0;i<ncol;i++) if(i!==map.fecha&&ratio(i,parseNum)>.7&&ratio(i,parseDate)<.3) nums.push(i);
  if(nums.length) map.importe=nums[0]; if(nums.length>1) map.saldo=nums[nums.length-1];
  let best=-1,len=0; for(i=0;i<ncol;i++){ if(i===map.fecha||nums.includes(i)) continue; const L=sample_.reduce((a,r)=>a+String(r[i]??"").length,0); if(L>len){len=L;best=i;} }
  if(best>=0) map.desc=best;
  return map.fecha!=null&&map.importe!=null&&map.desc!=null?{hi:-1,map,head:Array.from({length:ncol},(_,k)=>"Columna "+String.fromCharCode(65+k))}:null;
}
function handlePastedText(text){
  text=text.replace(/\r\n?/g,"\n").trim(); if(!text) return;
  const rows=parseCSV(text), multi=rows.filter(r=>r.length>1).length;
  const det=multi>=2?(detectTable(rows)||guessMapNoHeader(rows)):null;
  let b;
  if(det){ b={kind:"tabla",name:"Celdas pegadas",rows,hi:det.hi,map:det.map,head:det.head,acc:guessAcc(det,"")}; b.maestro=det.map.mes!=null||det.map.flujo!=null; }
  else if(text.length>40) b={kind:"pdf",name:"Texto pegado",text};
  else { toast("No se reconocen movimientos en lo que has pegado."); return; }
  S.pending=(S.pending||[]).concat([b]); S.view="movimientos"; render(); toast(det?"Celdas reconocidas: revisa la vista previa.":"Texto pegado: pulsa «Leer con Claude».");
}
function onPaste(e){
  const t=e.target, box=t&&t.id==="paste-box";
  if(!box&&(S.view!=="movimientos"||document.querySelector(".drawer")||(t&&/INPUT|TEXTAREA|SELECT/.test(t.tagName)))) return;
  const cd=e.clipboardData; if(!cd) return;
  const ims=[...(cd.files||[])].filter(isImgFile); if(ims.length&&shotAvailable()){ e.preventDefault(); openShotReader(ims); return; }
  const files=[...(cd.files||[])].filter(f=>/pdf|sheet|excel|csv|text|opendocument/.test(f.type)||/\.(pdf|xlsx?|xlsm|csv|ods|txt)$/i.test(f.name||""));
  if(files.length){ e.preventDefault(); handleFiles(files); return; }
  if((cd.files||[]).length&&!cd.getData("text/plain")){ e.preventDefault(); toast("Solo se pueden pegar archivos Excel, CSV o PDF."); return; }
  const text=cd.getData("text/plain");
  const looksFile=!text||/^(file:\/\/|\/private\/|\/var\/)/i.test(text.trim())||/^[^\n]{1,120}\.(pdf|xlsx?|xlsm|csv|ods)$/i.test(text.trim());
  if(box&&looksFile){ e.preventDefault(); toast(isMobile()?"El iPhone no deja pegar archivos en una web. Usa «Elegir archivo» y elígelo desde Archivos.":"No se ha pegado ningún archivo. Arrástralo o usa la zona de importar."); return; }
  if(!text) return;
  e.preventDefault(); handlePastedText(text);
}

  try{ history.pushState({fp:S.nav.length},""); NAVH=true; }catch(e){ NAVH=false; } }
function navBack(){ const st=S.nav.pop(); if(!st) return false;
  S.view=st.view; S.filter=st.filter; S.back=st.back; S.page=st.page; try{sessionStorage.setItem("fp-view",S.view)}catch(_){}
  render(); window.scrollTo(0,st.y); setTimeout(()=>window.scrollTo(0,st.y),60); return true; }
function closeOverlays(){ const dr=document.getElementById("drawer-root"); if(dr&&dr.innerHTML){ dr.innerHTML=""; render(); return true; } const lb=document.querySelector(".lightbox"); if(lb){ lb.remove(); return true; } return false; }
function backGesture(){ if(closeOverlays()) return; if(!S.nav.length) return; if(NAVH) history.back(); else navBack(); }
addEventListener("popstate",()=>{ closeOverlays(); navBack(); });
// Gesto: arrastrar desde el borde izquierdo hacia la derecha
(()=>{ let x0=null,y0=0,dx=0,on=false; const EDGE=28, MIN=70;
  const ind=document.createElement("div"); ind.className="swipe-back"; ind.innerHTML='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>'; document.body.appendChild(ind);
  addEventListener("touchstart",e=>{ if(e.touches.length!==1||document.querySelector(".onb")) return; const t=e.touches[0]; if(t.clientX>EDGE) return;
    if(!S.nav.length&&!document.getElementById("drawer-root").innerHTML&&!document.querySelector(".lightbox")) return; x0=t.clientX; y0=t.clientY; dx=0; on=false; },{passive:true});
  addEventListener("touchmove",e=>{ if(x0==null) return; const t=e.touches[0]; dx=t.clientX-x0; const dy=Math.abs(t.clientY-y0);
    if(!on&&dy>Math.abs(dx)&&dy>10){ x0=null; return; } if(dx>8) on=true; if(!on) return;
    const k=Math.min(1,dx/MIN); ind.style.opacity=k; ind.style.transform=`translate(${Math.min(dx,MIN)*0.6}px,-50%) scale(${0.7+0.3*k})`; ind.classList.toggle("ready",dx>=MIN);
    document.getElementById("main").style.transform=`translateX(${Math.min(dx*0.35,40)}px)`; },{passive:true});
  const end=()=>{ if(x0==null) return; const ok=on&&dx>=MIN; x0=null; on=false; ind.style.opacity=0; ind.style.transform="translate(0,-50%) scale(.7)"; ind.classList.remove("ready"); document.getElementById("main").style.transform=""; if(ok) backGesture(); };
  addEventListener("touchend",end,{passive:true}); addEventListener("touchcancel",end,{passive:true});
})();

  if(t.dataset.recq){ const w=t.dataset.recq.split(" ").sort((a,b)=>b.length-a.length)[0]; pushNav(); S.back=S.view; S.filter={q:w,acc:"",mes:"",cat:"",flag:""}; S.page=0; S.view="movimientos"; try{sessionStorage.setItem("fp-view",S.view)}catch(_){} render(); window.scrollTo(0,0); return; }
  if(t.dataset.recok){ S.cfg.dismissed=Object.assign({},S.cfg.dismissed,{[t.dataset.recok]:1}); saveCfg(); render(); return; }
  if(t.dataset.cierre){ openCierre(t.dataset.cierre); return; }
  if(t.dataset.remind==="snooze"){ S.cfg.ui=Object.assign({},S.cfg.ui||{},{remindSnooze:today()}); saveCfg(); render(); return; }
  if(t.dataset.remind==="imp"){ pushNav(); S.back=null; S.view="movimientos"; render(); window.scrollTo(0,0); const fi=document.getElementById("file-in"); if(fi) fi.click(); }
});
document.getElementById("ver-btn").disabled=true; document.getElementById("ver-btn").removeAttribute("title"); document.getElementById("ver-btn").style.cursor="default";
document.getElementById("tabs").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; if(b.id==="tab-more"){ openMore(); return; } if(b.id==="tab-fab"){ openQuick(); return; } const nv=subOf(b.dataset.v); if(nv!==S.view){ S.tabY[S.view]=window.scrollY; pushNav(); } S.back=null; S.view=nv; try{sessionStorage.setItem("fp-view",S.view)}catch(_){} render(); window.scrollTo(0,S.tabY[S.view]||0); });
// Al abrir: la página elegida para este tipo de dispositivo; al recargar dentro de la misma sesión, la que estaba abierta
try{ const v=sessionStorage.getItem("fp-view"); const np=navPref(), st=isPhone()?np.startMobile:np.startDesktop; let last=""; try{ last=localStorage.getItem("fp-last")||""; }catch(_){}
  if(VIEWS.includes(v)) S.view=v; else if(st==="__last"&&VIEWS.includes(last)) S.view=last; else if(VIEWS.includes(st)) S.view=st; }catch(_){}
if(location.hash&&VIEWS.includes(location.hash.slice(1))) S.view=location.hash.slice(1);
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&document.querySelector(".drawer")){ document.getElementById("drawer-root").innerHTML=""; render(); } });
boot();
</script>
