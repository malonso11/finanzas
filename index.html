}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;justify-content:space-between}
.id{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:34px;height:34px;flex:none;filter:drop-shadow(0 2px 6px rgba(0,87,217,.25))}
.onb-mark{width:72px;height:72px;filter:drop-shadow(0 8px 20px rgba(0,87,217,.3))}
h1{font-family:var(--f-disp);font-weight:700;font-size:20px;color:var(--accent);letter-spacing:-.015em;margin:0}
h2{font-family:var(--f-disp);font-size:17px;margin:0;font-weight:600;color:var(--accent);text-wrap:balance}
h3{font-size:14px;margin:0;font-weight:600}
.sub{color:var(--muted);font-size:12.5px}
.status{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.ver{font-family:var(--f-mono);font-size:11px;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:999px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.local{background:var(--warn)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{font:inherit;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 11px;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
nav.tabs button .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
nav.tabs button .badge{font-family:var(--f-mono);font-size:10.5px;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:0 6px}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:500}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label.drop:focus-within,tr.click:focus-visible,.hz:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
section.view{padding-block:20px 0;display:flex;flex-direction:column;gap:18px}
.lead{color:var(--muted);max-width:80ch;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
label.f > span{font-weight:500}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 8px;width:100%;min-width:0}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
textarea{resize:vertical;min-height:56px}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 12px;border-radius:5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
.tbl-wrap:not(.tbl-fill){overflow-y:hidden}
.tbl-wrap{overflow-x:auto;overscroll-behavior-x:contain;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;background:var(--surface-2);position:sticky;top:0;white-space:nowrap}
td.num,th.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
tr.cat-row td{background:var(--surface-2);font-weight:600}
tr.tot-row td{font-weight:600;border-top:2px solid var(--line)}
tr.sub-row td:first-child{padding-left:22px;color:var(--muted)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
td.desc{min-width:240px;max-width:460px}
.code{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.pos{color:var(--ok)}
.pill{display:inline-block;font-size:11px;font-weight:500;padding:1px 8px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-no{background:var(--surface-2);color:var(--muted)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.acc{font-family:var(--f-mono);font-size:10.5px;font-weight:500;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--fg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{display:block;font-family:var(--f-mono);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi span{font-size:12px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;max-width:95ch;margin:0}
.note.warn{border-left-color:var(--warn);color:var(--fg)}
.note.bad{border-left-color:var(--bad);color:var(--fg)}
.note.ok{border-left-color:var(--ok)}
.empty{padding:24px;text-align:center;color:var(--muted)}
label.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;cursor:pointer;background:var(--surface);color:var(--muted)}
label.drop b{color:var(--accent);font-size:15px}
label.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.pastebox textarea{min-height:52px;border-style:dashed;border-width:2px;background:var(--surface);text-align:center;resize:none;font-size:13px;color:var(--muted)}
.pastebox textarea:focus{border-color:var(--accent);background:var(--accent-soft)}
.src{font-size:10.5px;color:var(--muted);font-family:var(--f-mono)}
.flag{font-size:10.5px;font-family:var(--f-mono);color:var(--warn)}
.legend-row{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.chart svg text{font-family:var(--f-body)}
.ctip{font-size:12.5px;color:var(--muted);min-height:20px}
.ctip b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:minmax(120px,200px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hb-track{position:relative;height:14px;background:var(--surface-2);border-radius:4px}
.hb-fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0}
.hb-lim{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg)}
.hb-val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12.5px;white-space:nowrap;text-align:right;min-width:90px}
.prog{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;min-width:80px}
.prog i{display:block;height:100%;background:var(--ok)}
.prog i.warn{background:var(--warn)} .prog i.bad{background:var(--bad)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:60;max-width:90vw}
details.howto{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);padding:12px 16px}
details.howto>summary{font-weight:600;color:var(--accent);cursor:pointer}
details.panel>summary{cursor:pointer;font-weight:600}
.guide ul,.guide ol,.howto ol,.howto ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;max-width:95ch}
.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.drawer-bg{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(620px,100%);height:100%;overflow-y:auto;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--line)}
.drawer .actions{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);margin-inline:-16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;margin:0;min-width:0}
legend{font-size:12px;font-weight:600;padding:0 6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono);font-size:12.5px;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:2px 4px 2px 10px;font-size:12.5px}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:2px 6px;border-radius:999px}
.chip button:hover{color:var(--bad)}
.step{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .ico{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.step .ico.ok{background:var(--ok-soft);color:var(--ok)} .step .ico.warn{background:var(--warn-soft);color:var(--warn)} .step .ico.bad{background:var(--bad-soft);color:var(--bad)}
.hz{cursor:crosshair}
nav.tabs .ic{display:none} nav.tabs button.more{display:none}
.tbl-wrap:not(.cards) th:first-child,.tbl-wrap:not(.cards) td:first-child{position:sticky;left:0;z-index:1;background:var(--surface)}
.tbl-wrap:not(.cards) th:first-child{z-index:2;background:var(--surface-2)}
.tbl-wrap:not(.cards) tr.cat-row td:first-child{background:var(--surface-2)}
.mvlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mvday{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:10px 14px 5px;background:var(--surface-2)}
.mv{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 14px;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mvday+.mv{border-top:0}
.mv:active{background:var(--accent-soft)}
.mv-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.mv-desc{font-weight:500;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.mv-imp{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.mv-meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center}
.more-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface-2);border:0;border-radius:10px;padding:12px 14px;cursor:pointer}
.more-item b{font-weight:600}
.pg-order{display:flex;flex-direction:column;gap:6px}
.pg-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--surface-2)}
.pg-row.cut{margin-top:10px;position:relative}
.pg-row.cut::before{content:"En «Más» en el iPhone";position:absolute;top:-17px;left:2px;font-size:11px;color:var(--muted)}
.pg-ic{display:grid;place-items:center;color:var(--muted)}
.tbl-fill{flex:1 1 0;min-height:420px;overflow:auto}
@media (max-width:700px){.tbl-fill{flex:none;min-height:0;max-height:420px}}
.kdelta{display:block;margin-top:6px;font-size:12px}

<script>
const APP_VERSION="6.2.0";

/* =================== DOMINIO: TAXONOMÍA Y REGLAS POR DEFECTO (spec §3–§5) =================== */
const PAL={azul:"var(--c-azul)",naranja:"var(--c-naranja)",aqua:"var(--c-aqua)",amarillo:"var(--c-amarillo)",magenta:"var(--c-magenta)",verde:"var(--c-verde)",violeta:"var(--c-violeta)",gris:"var(--c-gris)",rojo:"var(--c-rojo)",coral:"var(--c-coral)",burdeos:"var(--c-burdeos)",rosa:"var(--c-rosa)",fucsia:"var(--c-fucsia)",morado:"var(--c-morado)",lavanda:"var(--c-lavanda)",indigo:"var(--c-indigo)",marino:"var(--c-marino)",cielo:"var(--c-cielo)",cian:"var(--c-cian)",turquesa:"var(--c-turquesa)",menta:"var(--c-menta)",esmeralda:"var(--c-esmeralda)",lima:"var(--c-lima)",oliva:"var(--c-oliva)",mostaza:"var(--c-mostaza)",ambar:"var(--c-ambar)",terracota:"var(--c-terracota)",marron:"var(--c-marron)",pizarra:"var(--c-pizarra)",carbon:"var(--c-carbon)"};
const DEFAULT_CATS=[
 {n:"Vehículo y transporte",t:"gasto",c:"azul",subs:["Gasolina y combustible"]},
 {n:"Hogar",t:"gasto",c:"naranja",subs:["Alquiler vivienda","Fianza (entrada vivienda)","Teléfono, TV e internet","Decoración y mobiliario","Luz y gas","Mantenimiento y reparaciones"]},
 {n:"Alimentación",t:"gasto",c:"aqua",subs:["Supermercados y alimentación"]},
 {n:"Otros gastos",t:"gasto",c:"amarillo",subs:["Transferencias","Gasto Bizum","Pago de impuestos","Autónomos","Suscripciones","Otros gastos (sin clasificar)"]},
 {n:"Compras",t:"gasto",c:"magenta",subs:["Compras (otros)","Liquidación tarjeta de crédito ING","Ropa y complementos","Tarjetas financieras y de crédito","Belleza, peluquería y perfumería","Regalos y juguetes","Electrónica"]},
 {n:"Educación y salud",t:"gasto",c:"verde",subs:["Deporte y gimnasio","Salud"]},
 {n:"Ocio y viajes",t:"gasto",c:"violeta",subs:["Cafeterías y restaurantes","Libros, música y videojuegos","Ocio y viajes (otros)","Cine, teatro y espectáculos","Estancos y tabaco"]},
 {n:"Nómina y otras prestaciones",t:"ingreso",c:"azul",subs:["Nómina o Pensión"]},
 {n:"Otros ingresos",t:"ingreso",c:"verde",subs:["Ingresos de efectivo","Ingresos de otras entidades","Ingreso Bizum","Rendimientos financieros (interés/dividendo/cashback)"]},
 {n:"Movimientos excluidos",t:"excluido",c:"gris",subs:["Traspaso entre cuentas"]},
 {n:"Ahorro e inversión",t:"ahorro",c:"gris",subs:["Aportación plan de ahorro (ETF)","Ahorro en cuenta (redondeo)"]}
];
const M=(ks,cat,sub)=>ks.map(k=>({k,cat,sub}));
const DEFAULT_MERCHANTS=[];
const DEFAULT_PEOPLE=[];
const DEFAULT_ING_FIXES=[
 {k:"FARMACIA",cat:"Educación y salud",sub:"Salud",nota:"No hay subcategoría de farmacia"}];
const DEFAULT_FIXED=["Alquiler vivienda","Teléfono, TV e internet","Luz y gas","Suscripciones","Autónomos","Tarjetas financieras y de crédito","Deporte y gimnasio"];
// Tipos crudos de Trade Republic → tipo normalizado
const TR_TYPES=[
 ["Transacción con tarjeta",/tarjeta|card|karte/i],
 ["Operar",/^operar|trade|handel|plan de ahorro|savings ?plan|sparplan|ejecuci/i],
 ["Transferencia",/transfer|berweisung|ingreso|deposit|retirada|withdraw/i],
 ["Interés",/inter[eé]s|interest|zins/i],
 ["Rentabilidad",/rentabilidad|earning|ertr|dividend/i],
 ["Bonificación",/bonific|reward|bonus|pr[aä]mie|saveback|cashback/i],
 ["Recibos domiciliados",/recibo|domicilia|direct ?debit|lastschrift/i],
 ["Regalo",/regalo|gift|geschenk|prize|lottery/i],
 ["Impuestos",/impuesto|steuer|^tax/i]];
const TR_TIPOS=TR_TYPES.map(x=>x[0]);
// Catálogo de bancos. p = lector/categorizador: "ing" (Excel con categorías del banco), "tr" (PDF/CSV de Trade Republic con tipos), "gen" (Excel o CSV genérico)
const BANKS=[
 {id:"ing",n:"ING",p:"ing",c:"naranja",hint:"Web de ING › tu cuenta › Movimientos › Descargar › Excel (.xls). Trae las categorías del banco."},
 {id:"tr",n:"Trade Republic",p:"tr",c:"azul",hint:"App › Perfil › Documentos › Extracto de cuenta (PDF) › Guardar en Archivos. También vale el CSV."},
 {id:"bbva",n:"BBVA",p:"gen",c:"marino"},{id:"santander",n:"Santander",p:"gen",c:"rojo"},{id:"caixabank",n:"CaixaBank",p:"gen",c:"cielo"},
 {id:"sabadell",n:"Banco Sabadell",p:"gen",c:"cian"},{id:"bankinter",n:"Bankinter",p:"gen",c:"naranja"},{id:"openbank",n:"Openbank",p:"gen",c:"rojo"},
 {id:"unicaja",n:"Unicaja",p:"gen",c:"verde"},{id:"kutxabank",n:"Kutxabank",p:"gen",c:"marino"},{id:"abanca",n:"Abanca",p:"gen",c:"azul"},
 {id:"ibercaja",n:"Ibercaja",p:"gen",c:"marino"},{id:"imagin",n:"imagin",p:"gen",c:"esmeralda"},{id:"evo",n:"EVO Banco",p:"gen",c:"verde"},
 {id:"revolut",n:"Revolut",p:"gen",c:"carbon"},{id:"n26",n:"N26",p:"gen",c:"turquesa"},{id:"myinvestor",n:"MyInvestor",p:"gen",c:"indigo"},
 {id:"wise",n:"Wise",p:"gen",c:"lima"},{id:"otro",n:"Otro banco",p:"gen",c:"gris"}];
const GEN_HINT="Desde la web del banco, exporta los movimientos en Excel o CSV. La app detecta sola las columnas de fecha, concepto, importe y saldo.";
const ACC_KINDS=["Cuenta corriente","Cuenta e inversión","Tarjeta de crédito","Cuenta de ahorro","Bróker"];
const LEGACY_ACCOUNTS=[{id:"ING",name:"ING",bank:"ing",kind:"Cuenta corriente",c:"naranja"},{id:"TR",name:"Trade Republic",bank:"tr",kind:"Cuenta e inversión",c:"azul"}];
const ACCS=()=>(S.cfg&&S.cfg.accounts)||[];
const accById=id=>ACCS().find(a=>a.id===id);
const bankOf=id=>BANKS.find(b=>b.id===(accById(id)||{}).bank)||BANKS[BANKS.length-1];
const accName=id=>(accById(id)||{}).name||id;
// Abreviatura de hasta 4 caracteres: la que elijas en la cuenta o una automática
const BANK_ABR={ing:"ING",tr:"TR",bbva:"BBVA",santander:"SAN",caixabank:"CAIX",sabadell:"SAB",bankinter:"BKT",openbank:"OPEN",unicaja:"UNI",kutxabank:"KUTX",abanca:"ABAN",ibercaja:"IBER",imagin:"IMAG",evo:"EVO",revolut:"REV",n26:"N26",myinvestor:"MYI",wise:"WISE"};
const ABR_SKIP=new Set(["cuenta","banco","plan","de","del","la","el","mi","mis","los","las"]);
function autoAbr(name,bank){ const n=String(name||"").trim(); if(!n) return "?"; if(n.length<=4) return n.toUpperCase();
  const b=BANKS.find(x=>x.id===bank); if(b&&lo(b.n)===lo(n)&&BANK_ABR[bank]) return BANK_ABR[bank];
  const w=n.split(/\s+/).filter(Boolean), code=w.find(x=>x.length<=4&&(/\d/.test(x)||x===x.toUpperCase()&&/[A-Z]/.test(x)));
  if(code) return code.toUpperCase();
  const sig=w.find(x=>!ABR_SKIP.has(lo(x)))||w[0]; return sig.slice(0,4).toUpperCase(); }
const accAbr=id=>{ const a=accById(id)||{}; return (a.abr||"").trim().slice(0,4)||autoAbr(a.name||id,a.bank); };
const accShort=id=>{ const a=accById(id)||{}, n=accName(id); return (a.abr||"").trim()?accAbr(id):n.length<=12?n:accAbr(id); };
const dot=(t,cc)=>`<span class="bankdot${String(t).length>=4?" l4":String(t).length===3?" l3":""}" style="--cc:${cc}">${esc(t)}</span>`;
const isTRacc=id=>bankOf(id).p==="tr";
const accColor=id=>PAL[(accById(id)||{}).c||bankOf(id).c]||PAL.gris;
const bankHint=b=>b.hint||GEN_HINT;
function newAccId(name){ let base=String(name).normalize("NFD").replace(/[^A-Za-z0-9]/g,"").toUpperCase().slice(0,10)||"CUENTA"; let id=base,i=2; while(ACCS().some(a=>a.id===id)) id=base+(i++); return id; }
const DEFAULT_CFG={cats:DEFAULT_CATS,merchants:DEFAULT_MERCHANTS,people:DEFAULT_PEOPLE,ownNames:[],ingFixes:DEFAULT_ING_FIXES,fixedSubs:DEFAULT_FIXED,
  alquiler:{texto:"",importe:null,tol:5,dias:7},objetivo:500,umbralTasa:500,
  etfs:{},
  monthStatus:{},limits:{},dismissed:{}};

/* =================== ESTADO Y PERSISTENCIA =================== */
const S={rows:[],cfg:structuredClone(DEFAULT_CFG),mode:"init",view:"movimientos",year:"",month:"",
  filter:{q:"",acc:"",mes:"",cat:"",flag:""},page:0,pending:null,busy:"",editing:null,sel:new Set()};
let db=null,downloads=null,sample=null,assets=null,mcp=null;
const saved={};           // docId -> JSON guardado (para escribir solo lo que cambia)
const LS_KEY="fp-v3";
const queues={},timers={};
function serial(key,fn){ queues[key]=(queues[key]||Promise.resolve()).then(fn).catch(e=>{console.error(e);toast("No se pudo guardar. Revisa la conexión e inténtalo de nuevo.")}); return queues[key]; }
function debounce(key,fn,ms=600){clearTimeout(timers[key]);timers[key]=setTimeout(fn,ms)}
const docIdOf=r=>r.acc+"_"+r.f.slice(0,7);
// JSON con claves ordenadas: el mismo contenido da siempre el mismo texto y no se reescribe sin cambios
const canon=v=>JSON.stringify(v,(k,x)=>x&&typeof x==="object"&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,kk)=>(o[kk]=x[kk],o),{}):x);
function lsSet(){try{localStorage.setItem(LS_KEY,JSON.stringify({rows:S.rows,cfg:S.cfg}))}catch(e){toast("El navegador no tiene espacio para guardar más. Haz una copia JSON.")}}
function lsGet(){try{return JSON.parse(localStorage.getItem(LS_KEY)||"null")}catch(e){return null}}
function commit(){
  if(S.mode!=="db"){ lsSet(); return Promise.resolve(); }
  const groups={}; for(const r of S.rows)(groups[docIdOf(r)]=groups[docIdOf(r)]||[]).push(r);
  const ps=[];
  for(const id of new Set(Object.keys(groups).concat(Object.keys(saved)))){
    const items=(groups[id]||[]).slice().sort((a,b)=>a.k<b.k?-1:a.k>b.k?1:0);
    const js=items.length?canon(items):"";
    if(js===(saved[id]||"")) continue;
    saved[id]=js;
    ps.push(serial("d-"+id,()=>items.length?db.collection("movs").doc(id).set({items}):db.collection("movs").doc(id).delete()));
    if(!items.length) delete saved[id];
  }
  return Promise.all(ps);
}
function saveCfg(){ invalidate(); if(S.mode==="db") debounce("cfg",()=>serial("cfg",()=>db.doc("cfg/main").set(S.cfg))); else lsSet(); }
function setStatus(){
  const d=document.getElementById("st-dot"),t=document.getElementById("st-txt");
  d.className="dot"+(S.mode==="db"?" on":S.mode==="local"?" local":"");
  t.textContent=S.busy||(S.mode==="db"?"Guardado en el artefacto":S.mode==="local"?"Guardado en este navegador · haz copias JSON":"Conectando…");
}
function editingNow(){ const a=document.activeElement; return (a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&document.getElementById("main").contains(a))||!!document.querySelector(".drawer"); }
function softRender(){ if(!editingNow()) render(); }
async function boot(){
  render();
  let ns=null;
  try{ if(window.claude&&window.claude.use){ ns=await window.claude.use("db"); downloads=await window.claude.use("downloads"); sample=await window.claude.use("sample"); assets=await window.claude.use("assets"); mcp=await window.claude.use("mcp"); if(mcp&&S.view==="patrimonio") softRender(); } }catch(e){ns=null}
  if(ns){
    db=ns; S.mode="db"; setStatus();
    db.collection("movs").onSnapshot(snap=>{ const rows=[]; for(const k in saved) delete saved[k];
      snap.docs.forEach(d=>{ const x=d.data(); if(x&&Array.isArray(x.items)){ saved[d.id]=canon(x.items); x.items.forEach(r=>rows.push(structuredClone(r))); } });
      S.rows=rows; invalidate(); softRender(); }, e=>console.error(e));
    db.doc("cfg/main").onSnapshot(s=>{ if(s.exists){ S.cfg=mergeCfg(structuredClone(s.data())); invalidate(); softRender(); } }, e=>console.error(e));
  } else {
    S.mode="local"; const l=lsGet(); if(l){ S.rows=l.rows||[]; S.cfg=mergeCfg(l.cfg||{}); } invalidate(); render();
  }
}
function mergeCfg(c){ const o=Object.assign(structuredClone(DEFAULT_CFG),c); o.etfs=Object.assign(structuredClone(DEFAULT_CFG.etfs),c.etfs||{}); if(c.etf&&c.etf.isin&&c.etf.precio!=null&&!(c.etfs||{})[c.etf.isin]) o.etfs[c.etf.isin]={nombre:c.etf.nombre,precio:c.etf.precio,fechaNav:c.etf.fechaNav,actualizado:c.etf.actualizado,hist:c.etf.hist||[]}; delete o.etf; if(!Array.isArray(c.accounts)) o.accounts=structuredClone(LEGACY_ACCOUNTS); o.people=uniq(o.people||[]); o.ownNames=uniq(o.ownNames||[]); o.bankMap=Array.isArray(o.bankMap)?o.bankMap:[];
  if(Array.isArray(o.cats)) o.cats=o.cats.map(x=>x.n==="Ahorro e inversión"&&Array.isArray(x.subs)&&!x.subs.includes("Ahorro en cuenta (redondeo)")?Object.assign({},x,{subs:x.subs.concat(["Ahorro en cuenta (redondeo)"])}):x); o.alquiler=Object.assign(structuredClone(DEFAULT_CFG.alquiler),c.alquiler||{}); if(!Array.isArray(o.cats)||o.cats.some(x=>!Array.isArray(x.subs))) o.cats=structuredClone(DEFAULT_CATS); return o; }

/* =================== UTILIDADES =================== */

// Lector del PDF «Extracto de cuenta» de Trade Republic (columnas FECHA · TIPO · DESCRIPCIÓN · ENTRADA DE DINERO · SALIDA DE DINERO · BALANCE)

async function parseTRPdf(buf){
  const pages=await pdfItems(buf);

  const amount=t=>{ const v=parseNum(String(t).replace(/€/g,"")); return v==null?null:Math.abs(v); };
  const out=[];

    const hdr=items.find(i=>i[2].trim()==="TIPO"); if(!hdr) continue;
    const hy=hdr[1], H=re=>items.find(i=>Math.abs(i[1]-hy)<=5&&re.test(i[2]));
    const cF=H(/^FECHA/), cD=H(/^DESCRIP/), cE=H(/^ENTRADA/), cS=H(/^SALIDA/), cB=H(/^BALANCE/);
    if(!cF||!cD||!cE||!cS||!cB) continue;
    const cx={f:cF[0],t:hdr[0],d:cD[0],e:cE[0],s:cS[0],b:cB[0]};
    // fin de la tabla: primer título de sección en mayúsculas por debajo de la cabecera (si lo hay)
    const stop=items.filter(i=>i[1]<hy-6&&Math.abs(i[0]-cx.f)<4&&/^[A-ZÁÉÍÓÚÑ ]{8,}$/.test(i[2].trim())).sort((a,b)=>b[1]-a[1])[0];

    const months=body.filter(i=>Math.abs(i[0]-cx.f)<4&&MES_N[i[2].trim().toLowerCase()]).sort((a,b)=>b[1]-a[1]);
    months.forEach((m,mi)=>{
      const up=mi>0?(months[mi-1][1]+m[1])/2:m[1]+20, dn=mi<months.length-1?(months[mi+1][1]+m[1])/2:m[1]-20;

      band.filter(i=>i[0]>cx.f+8&&i[0]<cx.e-25).sort((a,b)=>b[1]-a[1]||a[0]-b[0]).forEach(i=>{
        const t=i[2].replace(/\s+/g," ").trim();

        else descParts.push([i[1],t]);

      let ent=null,sal=null,bal=null;
      band.filter(i=>i[0]>=cx.e-35&&/\d/.test(i[2])).forEach(a=>{ const d=[["e",Math.abs(a[0]-cx.e)],["s",Math.abs(a[0]-cx.s)],["b",Math.abs(a[0]-cx.b)]].sort((x,y)=>x[1]-y[1])[0][0]; const v=amount(a[2]); if(d==="e") ent=v; else if(d==="s") sal=v; else bal=v; });

      out.push({f,desc,com:"",tipoRaw:tipo,cat:"",sub:"",imp:Math.round(((ent||0)-(sal||0))*100)/100,saldo:bal==null?null:Math.round(bal*100)/100,mes:"",flujo:"",obs:"",units:null});
    });
  }

}

function niceScale(min,max,n=4){
  if(min===max){ max=min+1; }
  const span=max-min, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0))), r=step0/mag;
  const step=(r<=1?1:r<=2?2:r<=2.5?2.5:r<=5?5:10)*mag;
  const lo_=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step; const ticks=[]; for(let v=lo_;v<=hi+step/2;v+=step) ticks.push(Math.round(v*1e6)/1e6);
  return {lo:lo_,hi,ticks};
}

  const bar=(x,v0,v1,w,col)=>{ const a=y(v0),b=y(v1),top=Math.min(a,b),h=Math.abs(a-b); if(h<0.5) return ""; return `<rect x="${x}" y="${top}" width="${w}" height="${h}" rx="2" fill="${col}"/>`; };

function donut(id,parts){

}
function filteredRows(){
  const f=S.filter; let l=S.rows;
  if(f.acc) l=l.filter(r=>r.acc===f.acc);
  if(f.mes) l=l.filter(r=>mesOf(r)===f.mes);
  if(f.cat){ const [c,s]=f.cat.split("|"); l=l.filter(r=>r.cat===c&&(!s||r.sub===s)); }
  if(f.flag==="revisar") l=l.filter(r=>r.src==="fallback");
  if(f.flag==="obs") l=l.filter(r=>(r.obs||"").trim());
  if(f.flag==="ajuste") l=l.filter(r=>r.mesOv||r.flujoOv||r.src==="manual");
  if(f.flag==="ticket") l=l.filter(r=>(r.att||[]).length);
  if(f.flag==="sinticket") l=l.filter(r=>flujo(r)==="Gasto"&&!(r.att||[]).length);
  if(f.flag==="extra") l=l.filter(r=>r.extra);
  if(f.year) l=l.filter(r=>mesOf(r).startsWith(f.year));
  if(f.hasta) l=l.filter(r=>mesOf(r)<=f.hasta);
  if(f.desde) l=l.filter(r=>mesOf(r)>=f.desde);
  if(f.fl) l=l.filter(r=>flMatch(r,f.fl));
  if(f.q){ const q=lo(f.q); l=l.filter(r=>lo(r.desc+" "+r.com+" "+r.obs).includes(q)||String(r.imp).includes(f.q.replace(",","."))); }
  return l.slice().sort((a,b)=>a.k<b.k?1:a.k>b.k?-1:a.acc.localeCompare(b.acc));
}

    <div class="tbl-wrap cards"><table><thead><tr><th>Excluido en</th><th>Parte mal categorizada</th><th>Categoría actual</th><th class="num">Importe</th><th></th></tr></thead><tbody>${rd.halfPairs.map(({a,b})=>`<tr><td class="sub"><span class="acc">${esc(accShort(a.acc))}</span> ${fdate(a.f)} · ${esc(a.desc.slice(0,48))}</td><td class="desc"><span class="acc">${esc(accShort(b.acc))}</span> ${fdate(b.f)} · ${esc(b.desc)}</td><td class="sub">${esc(b.cat)} › ${esc(b.sub)}</td><td class="num">${eur(b.imp)}</td><td style="white-space:nowrap"><button class="btn sm primary" data-pairfix="${b.id}">Marcar como traspaso</button> <button class="btn sm" data-pairno="${b.id}">No es la pareja</button></td></tr>`).join("")}</tbody></table></div>
    ${rd.halfPairs.length>1?`<div class="row"><button class="btn" id="pairfix-all">Marcar los ${rd.halfPairs.length} como traspaso</button></div>`:""}</div>`);
  if(rd.unknownTypes.length) sec.push(`<div class="panel"><h3>Tipos de movimiento no reconocidos (${rd.unknownTypes.length})</h3><p class="note">Han ido a «Otros gastos (sin clasificar)». Ábrelos y asígnales categoría a mano.</p>${rd.unknownTypes.slice(0,30).map(r=>`<div class="row"><span class="code">${fdate(r.f)}</span><span>${esc(r.tipoRaw||"(vacío)")}</span><span class="sub">${esc(r.desc)}</span><button class="btn sm" data-open="${r.id}">Abrir</button></div>`).join("")}</div>`);
  if(rd.unknownCats.length) sec.push(`<div class="panel"><h3>Categorías que no están en tu taxonomía (${rd.unknownCats.length})</h3><p class="note">Son categorías que pone el banco en su extracto. Elige a qué categoría van todas a la vez: se crea una regla para que las de próximos extractos vayan solas. Revisa antes las filas si tienes dudas.</p>
    ${[...new Set(rd.unknownCats.map(r=>r.cat))].map((c,i)=>{ const rs=rd.unknownCats.filter(r=>r.cat===c), subs=[...new Set(rs.map(r=>r.sub).filter(Boolean))], tot=rs.reduce((a,r)=>a+r.imp,0);
      return `<div style="display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line)"><div class="row"><b style="font-weight:600">${esc(c)}</b>${subs.length?`<span class="sub">› ${subs.map(esc).join(", ")}</span>`:""}<span class="sub">${rs.length} filas · ${eur(tot)}</span><button class="btn sm" data-fcat="${esc(c)}">Ver filas</button></div>
      <div class="row"><span class="sub">Pasar todas a</span><select id="uc-${i}" style="flex:1;min-width:220px;max-width:420px">${catSubOptions(/ahorro/i.test(c)?"Ahorro e inversión|Ahorro en cuenta (redondeo)":"",true)}</select><button class="btn sm primary" data-ucgo="${i}" data-ucat="${esc(c)}">Cambiar las ${rs.length}</button><button class="btn sm" data-addcat="${esc(c)}" title="Mantener la categoría del banco como nueva categoría de gasto">Añadir como categoría de gasto</button></div></div>`; }).join("")}
    <p class="note">«Traspaso entre cuentas» no cuenta como gasto ni como ingreso. «Ahorro en cuenta (redondeo)» tampoco es gasto, pero suma a «Aportado a ahorro e inversión» sin mezclarse con tu ETF.</p></div>`);
  if(rd.obs.length) sec.push(`<div class="panel"><h3>Observaciones pendientes (${rd.obs.length})</h3><p class="note">Tus notas sobre filas concretas. Aplica la corrección y márcala como resuelta; la nota queda en el historial de la fila.</p>${rd.obs.map(r=>`<div class="row"><span class="code">${fdate(r.f)}</span><span class="acc">${esc(accShort(r.acc))}</span><span>${esc(r.desc)}</span><span class="flag">✎ ${esc(r.obs)}</span><span class="spacer"></span><button class="btn sm" data-open="${r.id}">Abrir</button><button class="btn sm" data-obsok="${r.id}">Resuelta</button></div>`).join("")}</div>`);
  if(rd.recAlerts.length) sec.push(`<div class="panel"><h3>Recurrentes que cambian (${rd.recAlerts.length})</h3><p class="note">Suscripciones o cargos fijos que han subido de precio o que aparecen por primera vez.</p>
    <div class="tbl-wrap cards"><table><thead><tr><th>Concepto</th><th>Aviso</th><th class="num">Al año</th><th></th></tr></thead><tbody>${rd.recAlerts.map(({x,up})=>`<tr><td>${esc(shortDesc(x.desc))}<div class="sub">${esc(x.sub||x.cat)} · último cobro ${fdate(x.last)}</div></td><td>${up?`<span class="pill p-warn">Sube de ${eur0(x.cambio.de)} a ${eur0(x.cambio.a)}</span>`:`<span class="pill p-acc">Nuevo</span>`}</td><td class="num">${eur0(x.anual)}</td><td style="white-space:nowrap"><button type="button" class="btn sm" data-recq="${esc(x.k)}">Ver</button> <button type="button" class="btn sm" data-recok="${esc(up?"rec|"+x.k+"|"+x.lastId:"recn|"+x.k)}">Entendido</button></td></tr>`).join("")}</tbody></table></div></div>`);
  const ov=rd.overrides;
  return `<section class="view">
  <div><h2>Revisión mensual</h2><p class="lead">El flujo de trabajo de cada mes: lo que ya está resuelto, lo que necesita tu criterio y los ajustes que se han aplicado para poder auditarlos.</p></div>
  <div class="panel"><h3>Lista de comprobación</h3>
   ${step(S.rows.length?"ok":"","Importar extractos",S.rows.length?"Último movimiento: "+ACCS().map(a=>`${esc(accShort(a.id))} ${fdate(lastSaldo(a.id)?.f)||"—"}`).join(" · "):"Aún no hay datos.",`<button class="btn sm" data-go="movimientos">Importar</button>`)}
   ${step(rd.halfPairs.length?"warn":S.rows.length?"ok":"","Traspasos entre tus cuentas",rd.halfPairs.length?`${rd.halfPairs.length} con una parte sin excluir.`:"Las dos partes de cada traspaso coinciden.")}
   ${step(rd.breaks.length?"bad":S.rows.length?"ok":"","Cadena de saldos",rd.breaks.length?`${rd.breaks.length} saltos por revisar.`:rd.breaksOk?`Cuadra, con ${rd.breaksOk} ${rd.breaksOk===1?"hueco aceptado":"huecos aceptados"}.`:"Cuadra en todas las cuentas.")}
   ${step(um.length+rd.transfers.length+rd.unknownTypes.length+rd.unknownCats.length?"warn":S.rows.length?"ok":"","Categorías",um.length+rd.transfers.length+rd.unknownTypes.length+rd.unknownCats.length?`${um.length} comercios, ${rd.transfers.length} transferencias, ${rd.unknownTypes.length} tipos y ${rd.unknownCats.length} filas con categoría desconocida.`:"Todo identificado.")}
   ${step(rd.refunds.length?"warn":"ok","Devoluciones y alquiler adelantado",`${rd.refunds.length} importes positivos en gasto por decidir · ${S.rows.filter(r=>r.mesSrc==="alquiler").length} alquileres movidos al mes siguiente · ${S.rows.filter(r=>r.flujoSrc==="devolucion").length} devoluciones detectadas solas.`)}
   ${step(!e.held.length?"":e.sinPrecio.length||e.viejos.length?"warn":"ok","Cotización de los ETF",!e.held.length?"Sin posiciones en ETF.":e.sinPrecio.length?`Sin precio: ${e.sinPrecio.map(x=>esc(x.nombre)).join(", ")}. Su valor no cuenta en el patrimonio.`:e.viejos.length?`NAV de hace más de 7 días: ${e.viejos.map(x=>esc(x.nombre)+(x.age!=null?` (${x.age} días)`:"")).join(", ")}.`:`${e.held.length} ${e.held.length===1?"ETF":"ETF"} con NAV al día.`,`<button class="btn sm" data-go="patrimonio">Actualizar</button>`)}
   ${step(rd.obs.length?"warn":"ok","Observaciones",rd.obs.length?`${rd.obs.length} notas pendientes.`:"Sin notas pendientes.")}
   ${step(rd.pend.length?"warn":"ok","Estado de los meses",rd.pend.length?`Parciales: ${rd.pend.map(mShort).join(", ")}. Márcalos como completos en Resumen cuando un extracto posterior lo confirme.`:"Todos completos.",`<button class="btn sm" data-go="resumen">Resumen</button>`)}
  </div>
  ${sec.join("")||`<div class="panel empty">Nada pendiente de revisar.</div>`}
  <details class="panel"><summary>Ajustes y correcciones aplicados (${ov.length})</summary>
   <p class="note">Trazabilidad: cada fila con mes contable distinto de su fecha, flujo forzado o categoría puesta a mano.</p>
   ${ov.length?`<div class="tbl-wrap cards"><table><thead><tr><th>Fecha</th><th>Cuenta</th><th>Descripción</th><th>Ajuste</th><th>Origen</th><th></th></tr></thead><tbody>${sortRows(ov).reverse().map(r=>`<tr><td class="code">${fdate(r.f)}</td><td><span class="acc">${esc(accShort(r.acc))}</span></td><td class="desc">${esc(r.desc)}</td><td class="sub">${[r.mesOv?`Mes → ${r.mesOv}`:"",r.flujoOv?"Flujo → Gasto":"",r.src==="manual"?`Categoría → ${esc(r.cat)} › ${esc(r.sub)}`:""].filter(Boolean).join("<br>")}</td><td class="sub">${[r.mesSrc,r.flujoSrc,r.src==="manual"?"manual":""].filter(Boolean).map(x=>({alquiler:"regla alquiler",devolucion:"devolución detectada",maestro:"Excel maestro",manual:"manual"})[x]||x).join(", ")}</td><td><button class="btn sm" data-open="${r.id}">Abrir</button></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Ninguno.</div>`}
  </details>
  </section>`;
}

function vResumen(){
  if(!S.rows.length) return `<section class="view"><h2>Resumen</h2><div class="panel empty">Importa movimientos para ver el resumen.</div></section>`;
  const ms=periodMonths(false), A=ms.map(aggOf);
  const T=A.reduce((a,x)=>({ing:a.ing+x.ing,gas:a.gas+x.gas,aho:a.aho+x.aho}),{ing:0,gas:0,aho:0}); T.neto=T.ing-T.gas;
  // KPIs: «al día» incluye el mes en curso; «meses cerrados» se queda en el último mes terminado
  const kMode=(S.pmode||"anio")==="mes"?"hoy":(((S.cfg.ui||{}).resKpi)||"hoy"), cm=thisMonth(), kms=kMode==="cerrado"?ms.filter(m=>m<cm):ms, hasCur=ms.some(m=>m>=cm);
  const TK=kms.map(aggOf).reduce((a,x)=>({ing:a.ing+x.ing,gas:a.gas+x.gas,aho:a.aho+x.aho}),{ing:0,gas:0,aho:0}); TK.neto=TK.ing-TK.gas;
  const xgK=kms.reduce((t,m)=>t+aggOf(m).xg,0);
  // Comparativa con el mismo periodo del año anterior (el mes en curso se prorratea por días)
  const yoy=(S.pmode||"anio")!=="todo"&&ms.some(m=>aggOf(addMonths(m,-12)).n), py=(S.pmode||"anio")==="anio"?String(+curYear()-1):"año anterior";
  const fac=m=>m===cm?new Date().getDate()/daysIn(m):1, prevSum=(list,fn)=>list.reduce((t,m)=>t+fn(aggOf(addMonths(m,-12)))*fac(m),0);
  const TP={ing:prevSum(kms,a=>a.ing),gas:prevSum(kms,a=>a.gas),aho:prevSum(kms,a=>a.aho)}; TP.neto=TP.ing-TP.gas;
  const kAttr=fl=>`data-drill="" data-fl="${fl}" tabindex="0" role="link"${perDrill(kms.length?kms:ms)}`;
  const kd=(cur,prev,upBad,abs)=>yoy?`<small class="kdelta">${deltaHTML(cur,prev,upBad,abs)} <span class="sub">vs ${py}</span></small>`:"";
  const PV=ms.includes(cm)&&(S.pmode||"anio")!=="todo"?prevision():null, objR=+S.cfg.objetivo||0;
  const lastClosed=kms.length?kms[kms.length-1]:"", endDay=m=>{ const [y,mm]=m.split("-").map(Number); return new Date(Date.UTC(y,mm,0)).toISOString().slice(0,10); };
  const kNote=(!kms.length?"Aún no hay ningún mes cerrado en este periodo.":kMode==="cerrado"?`Del ${fdate(kms[0]+"-01")} al ${fdate(endDay(lastClosed))} · ${kms.length} ${kms.length===1?"mes cerrado":"meses cerrados"}${hasCur?` (sin ${mLabel(cm).toLowerCase()}, en curso)`:""}`:`Del ${fdate(kms[0]+"-01")} a hoy${hasCur?` · incluye ${mLabel(cm).toLowerCase()}, en curso`:""}`)+(xgK>0.005?(sinExtra()?` · sin ${eur0(xgK)} de gastos extraordinarios`:` · incluye ${eur0(xgK)} de gastos extraordinarios`):"");
  const P=patrimonio();
  const gcats=S.cfg.cats.filter(c=>c.t==="gasto"), icats=S.cfg.cats.filter(c=>c.t==="ingreso");
  const yc=(cur,prev,upBad)=>yoy?`<td class="num sub">${prev?eur0(prev):"—"}</td><td class="num">${deltaHTML(cur,prev,upBad)}</td>`:"";
  const pivot=(cats,key,otros,otrosLbl,total)=>{ const ub=key==="G";
    let h=""; let colTot=ms.map(()=>0);
    for(const c of cats){ const vals=A.map(a=>a[key][c.n]?._||0); const tot=vals.reduce((a,b)=>a+b,0);
      const subs=[...new Set(c.subs.concat(...A.map(a=>Object.keys(a[key][c.n]||{}).filter(k=>k!=="_"))))];
      h+=`<tr class="cat-row"><td class="drill" data-drill="${esc(c.n)}" tabindex="0"><i class="sw" style="background:${catColor(c.n)}"></i>${esc(c.n)}</td>${vals.map((v,i)=>v?`<td class="num drill" data-drill="${esc(c.n)}" data-mes="${ms[i]}" tabindex="0">${eur0(v)}</td>`:`<td class="num">—</td>`).join("")}<td class="num">${eur0(tot)}</td>${yc(tot,prevSum(ms,a=>a[key][c.n]?._||0),ub)}</tr>`;
      subs.forEach(s=>{ const sv=A.map(a=>a[key][c.n]?.[s]||0); const st=sv.reduce((a,b)=>a+b,0); if(!st&&!sv.some(Boolean)) return; h+=`<tr class="sub-row"><td class="drill" data-drill="${esc(c.n+"|"+s)}" tabindex="0">${esc(s)}</td>${sv.map((v,i)=>v?`<td class="num sub drill" data-drill="${esc(c.n+"|"+s)}" data-mes="${ms[i]}" tabindex="0">${eur0(v)}</td>`:`<td class="num sub"></td>`).join("")}<td class="num sub">${eur0(st)}</td>${yc(st,prevSum(ms,a=>a[key][c.n]?.[s]||0),ub)}</tr>`; });
      vals.forEach((v,i)=>colTot[i]+=v); }
    const ov=A.map(a=>a[otros]); if(ov.some(v=>Math.abs(v)>0.005)){ h+=`<tr class="cat-row"><td>${otrosLbl}</td>${ov.map(v=>`<td class="num">${v?eur0(v):"—"}</td>`).join("")}<td class="num">${eur0(ov.reduce((a,b)=>a+b,0))}</td>${yc(ov.reduce((a,b)=>a+b,0),prevSum(ms,a=>a[otros]),ub)}</tr>`; ov.forEach((v,i)=>colTot[i]+=v); }
    const kp=A.map(a=>a[total]); const ok=colTot.every((v,i)=>Math.abs(v-kp[i])<0.01);
    h+=`<tr class="tot-row"><td>Total ${ok?`<span class="pill p-ok" title="Coincide con el KPI general">cuadra</span>`:`<span class="pill p-bad">no cuadra</span>`}</td>${colTot.map(v=>`<td class="num">${eur0(v)}</td>`).join("")}<td class="num">${eur0(colTot.reduce((a,b)=>a+b,0))}</td>${yc(colTot.reduce((a,b)=>a+b,0),prevSum(ms,a=>a[total]),ub)}</tr>`;
    return h; };
  const mhead=`<th>Categoría</th>${ms.map(m=>`<th class="num">${mShort(m)}</th>`).join("")}<th class="num">Total</th>${yoy?`<th class="num">${py}</th><th class="num">Δ</th>`:""}`;
  const evo=ms.map((m,i)=>{ const a=A[i], st=S.cfg.monthStatus[m]||"Parcial"; return `<tr><td class="drill" data-drill="" data-mes="${m}" tabindex="0">${isMobile()?mShort(m):mLabel(m)}</td><td><button class="pillbtn" data-mstat="${m}" title="Cambiar estado">${st==="Completo"?`<span class="pill p-ok">Completo</span>`:`<span class="pill p-warn">Parcial</span>`}</button>${st==="Completo"?` <button type="button" class="btn sm" data-cierre="${m}" title="Resumen del mes">Cierre</button>`:""}</td>${dcell(m,"ing",a.ing)}${dcell(m,"aho",a.aho)}${dcell(m,"gas",a.gas)}${dcell(m,"neto",a.neto,`color:${a.neto>=0?"var(--ok)":"var(--bad)"}`)}</tr>`; }).join("");
  return `<section class="view">
  <div class="row"><h2>Resumen</h2><span class="spacer"></span>${periodSel()}</div>
  <div class="row" style="gap:10px">${extraSeg()}${(S.pmode||"anio")==="mes"?"":`<div class="seg" role="group" aria-label="Periodo de los indicadores"><button type="button" data-kpim="hoy" aria-pressed="${kMode!=="cerrado"}">Al día</button><button type="button" data-kpim="cerrado" aria-pressed="${kMode==="cerrado"}">Meses cerrados</button></div>`}<span class="sub">${kNote}</span></div>
  <div class="kpis hero">
   <div class="kpi drill" ${kAttr("gas")} title="Ver los movimientos"><b>${eur0(TK.gas)}</b><span>Gastos del periodo</span>${kd(TK.gas,TP.gas,true)}</div>
   <div class="kpi drill" ${kAttr("ing")} title="Ver los movimientos"><b>${eur0(TK.ing)}</b><span>Ingresos del periodo</span>${kd(TK.ing,TP.ing,false)}</div>
   <div class="kpi drill" ${kAttr("neto")} title="Ver los movimientos"><b style="color:${TK.neto>=0?"var(--ok)":"var(--bad)"}">${eur0(TK.neto)}</b><span>Ahorro neto</span>${kd(TK.neto,TP.neto,false,true)}</div>
   <div class="kpi drill" ${kAttr("aho")} title="Ver los movimientos"><b>${eur0(TK.aho)}</b><span>Aportado a ahorro e inversión</span>${kd(TK.aho,TP.aho,false,true)}</div>
  </div>
  ${PV?`<div class="panel"><div class="row"><h3>Previsión de ${MESES[+cm.slice(5)-1]}</h3><span class="spacer"></span><span class="sub">Día ${PV.d} de ${PV.dim} · quedan ${PV.rest} ${PV.rest===1?"día":"días"}</span></div>
   <div class="kpis mini">
    <div class="kpi"><b>${eur0(PV.gasHoy)}</b><span>Gastado hasta hoy</span></div>
    <div class="kpi"><b>${eur0(PV.gasFin)}</b><span>Gasto previsto al cierre</span></div>
    <div class="kpi"><b>${eur0(PV.ingFin)}</b><span>Ingresos previstos${PV.ingFin>PV.ingHoy+0.005?` · llevas ${eur0(PV.ingHoy)}`:""}</span></div>
    <div class="kpi"><b style="color:${PV.netoFin>=0?"var(--ok)":"var(--bad)"}">${eur0(PV.netoFin)}</b><span>Ahorro previsto</span></div></div>
   <p class="note${objR&&PV.netoFin<objR?" warn":""}">${objR?(PV.netoFin>=objR?`Al ritmo actual llegarás a tu objetivo de ${eur0(objR)} con ${eur0(PV.netoFin-objR)} de margen.`:`Al ritmo actual te faltarán ${eur0(objR-PV.netoFin)} para tu objetivo de ${eur0(objR)}.`):"Define un objetivo de ahorro en la pestaña Ahorro para compararlo."}</p><details class="info"><summary><span class="i-ic">i</span>Cómo se calcula</summary><p class="note">Gasto previsto = lo gastado + recurrentes pendientes (${eur0(PV.pendT)}) + tu gasto variable medio de ${PV.base} ${PV.base===1?"mes":"meses"} (${eur0(PV.varDia)} al día, sin extraordinarios) × días que quedan. Ingresos: lo cobrado o tu media, lo que sea mayor.</p></details>
   ${PV.pend.length?`<details><summary class="sub">Recurrentes que aún no se han cobrado este mes (${PV.pend.length})</summary><div class="chips" style="margin-top:8px">${PV.pend.map(x=>`<span class="chip">${esc(shortDesc(x.desc))} · ${eur0(x.imp)}${x.dia?` · día ${x.dia}`:""}</span>`).join("")}</div></details>`:""}
  </div>`:""}
   <div class="panel"><h3>Ingresos, gastos y ahorro por mes</h3><p class="sub" style="margin:0">Dos columnas por mes que siempre miden lo mismo: a la izquierda lo ingresado (y en rojo lo que faltó, si gastaste más); a la derecha lo gastado (y en verde lo ahorrado).</p><div class="chart" id="ch-evo"></div></div>
   <div class="panel"><h3>Evolución mensual</h3><div class="tbl-wrap"><table><thead><tr><th>Mes</th><th>Estado</th><th class="num">Ingresos</th><th class="num">Ahorro/Inv.</th><th class="num">Gastos</th><th class="num">Neto</th></tr></thead><tbody>${evo}<tr class="tot-row"><td>Total</td><td></td><td class="num">${eur0(T.ing)}</td><td class="num">${eur0(T.aho)}</td><td class="num">${eur0(T.gas)}</td><td class="num">${eur0(T.neto)}</td></tr></tbody></table></div>
    <p class="note">Estado del mes: informativo. Pulsa para alternar entre Parcial y Completo.</p></div>
  <div class="panel"><h3>Gasto por categoría y subcategoría</h3><p class="sub" style="margin:0">Pulsa una categoría, una subcategoría o una cifra para ver sus movimientos.</p><div class="tbl-wrap"><table><thead><tr>${mhead}</tr></thead><tbody>${pivot(gcats,"G","otrosG","Gastos en otras categorías","gas")}</tbody></table></div>
   <p class="note">Los subtotales suman todos los movimientos de la categoría, también los de subcategorías sin fila propia. «Gastos en otras categorías» recoge salidas clasificadas en categorías de ingreso, para que el total cuadre con el KPI.</p></div>
  <div class="grid2">
   <div class="panel"><h3>Gasto por categoría a lo largo del tiempo</h3><div class="chart" id="ch-gcat"></div></div>
   <div class="panel"><h3>Ingreso por categoría a lo largo del tiempo</h3><div class="chart" id="ch-icat"></div></div>
  </div>
  <div class="panel"><h3>Ingreso por categoría y subcategoría</h3><div class="tbl-wrap"><table><thead><tr>${mhead}</tr></thead><tbody>${pivot(icats,"I","otrosI","Entradas en categorías de gasto (reembolsos sin anular)","ing")}</tbody></table></div></div>
  </section>`;

/* =================== EXTRAORDINARIOS · RECURRENTES · PREVISIÓN · COLCHÓN · EVOLUCIÓN =================== */
const sinExtra=()=>!!((S.cfg&&S.cfg.ui||{}).sinExtra);
const gasSinX=a=>sinExtra()?a.gas:a.gas-(a.xg||0);
function extraSeg(){
  const n=S.rows.filter(r=>r.extra).length; if(!n) return "";
  return `<div class="seg" role="group" aria-label="Gastos extraordinarios" title="${n} ${n===1?"movimiento marcado":"movimientos marcados"} como extraordinario"><button type="button" data-xtra="con" aria-pressed="${!sinExtra()}">Con extraordinarios</button><button type="button" data-xtra="sin" aria-pressed="${sinExtra()}">Sin extraordinarios</button></div>`;
}
const daysIn=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
const endOfMonth=m=>m+"-"+String(daysIn(m)).padStart(2,"0");
const shortDesc=d=>String(d).replace(/^(Pago en|Recibo|Compra en|Cargo)\s+/i,"").slice(0,48);
const ruleText=d=>String(d).replace(/^(Pago en|Recibo|Compra en|Compra|Cargo|Adeudo)\s+/i,"").replace(/\s+[A-Z]{2}$/,"").split(/\s+/).filter(w=>w&&!/\d/.test(w)).slice(0,3).join(" ").slice(0,40);
const REC_STOP=new Set(["www","com","the","and","for","slu"]);
function recKey(desc){
  const t=lo(desc).replace(/^(pago en|pago|recibo|compra en|compra|cargo|adeudo|domiciliacion|transaccion con tarjeta)\s+/,"");
  return t.replace(/[^a-z ]/g," ").split(" ").filter(w=>w.length>2&&!REC_STOP.has(w)).slice(0,2).join(" ");
}
let REC=null, PSER=null;
// Cargos que se repiten cada mes (o cada año) por un importe parecido en los últimos 13 meses
function recurrentes(){
  if(REC) return REC;
  const hoy=today(), desde=addMonths(thisMonth(),-13)+"-01", by={};
  for(const r of S.rows){ if(r.f<desde||r.imp>=0||r.extra||flujo(r)!=="Gasto"||catTipo(r.cat)!=="gasto") continue; const k=recKey(r.desc); if(k) (by[k]=by[k]||[]).push(r); }
  const out=[];
  for(const k in by){
    const L=by[k].slice().sort((a,b)=>a.f<b.f?-1:a.f>b.f?1:0), months=[...new Set(L.map(r=>r.f.slice(0,7)))];
    const am=L.map(r=>-r.imp).sort((a,b)=>a-b), med=am[Math.floor(am.length/2)], near=L.filter(r=>Math.abs(-r.imp-med)<=Math.max(1,med*0.15));
    let freq=null, variable=false;
    const span=months.length?1+(+months[months.length-1].slice(0,4)-+months[0].slice(0,4))*12+(+months[months.length-1].slice(5)-+months[0].slice(5)):0;
    if(months.length>=3&&near.length/L.length>=0.75&&L.length<=months.length*1.5) freq="mensual";
    // Un cargo al mes casi todos los meses aunque el importe cambie (luz, teléfono…)
    else if(months.length>=4&&L.length<=months.length*1.25&&months.length>=span*0.7&&near.length/L.length>=0.4){ freq="mensual"; variable=true; }
    else if(L.length>=2&&near.length===L.length){ const d=daysBetween(L[L.length-2].f,L[L.length-1].f); if(d>=330&&d<=400) freq="anual"; }
    if(!freq) continue;
    const last=L[L.length-1], prev=L[L.length-2], gap=daysBetween(last.f,hoy);
    if(freq==="mensual"?gap>45:gap>400) continue;
    const a=-last.imp, b=prev?-prev.imp:null;
    const cambio=!variable&&b!=null&&Math.abs(a-b)>=0.1&&Math.abs(a/b-1)>=0.005?{de:b,a}:null;
    const ds=near.map(r=>+r.f.slice(8,10)).sort((x,y)=>x-y), dia=ds[Math.floor(ds.length/2)];
    const ref=variable?med:a;
    out.push({k,variable,desc:last.desc,cat:last.cat,sub:last.sub,acc:last.acc,freq,imp:ref,last$:a,mes:freq==="mensual"?ref:ref/12,anual:freq==="mensual"?ref*12:ref,desde:L[0].f,last:last.f,lastId:last.id,n:L.length,cambio,nuevo:daysBetween(L[0].f,hoy)<=75,dia});
  }
  out.sort((x,y)=>y.anual-x.anual); REC=out; return out;
}
// Previsión del mes en curso: lo gastado + recurrentes pendientes + gasto variable diario medio × días que quedan
function prevision(){
  const m=thisMonth(), a=aggOf(m), d=new Date().getDate(), dim=daysIn(m), rest=dim-d;
  const rec=recurrentes().filter(x=>x.freq==="mensual"), keys=new Set(rec.map(x=>x.k));
  const cobrados=new Set(S.rows.filter(r=>mesOf(r)===m&&r.imp<0).map(r=>recKey(r.desc)));
  const pend=rec.filter(x=>!cobrados.has(x.k)), pendT=pend.reduce((t,x)=>t+x.imp,0);
  const prevMs=[1,2,3].map(i=>addMonths(m,-i)).filter(x=>aggOf(x).n);
  const recOf=mm=>S.rows.filter(r=>mesOf(r)===mm&&r.imp<0&&!r.extra&&flujo(r)==="Gasto"&&keys.has(recKey(r.desc))).reduce((t,r)=>t-r.imp,0);
  const varDia=prevMs.length?prevMs.reduce((t,mm)=>t+Math.max(0,gasSinX(aggOf(mm))-recOf(mm))/daysIn(mm),0)/prevMs.length:0;
  const gasFin=a.gas+pendT+varDia*rest;
  const ingMed=prevMs.length?prevMs.reduce((t,mm)=>t+aggOf(mm).ing,0)/prevMs.length:0, ingFin=Math.max(a.ing,ingMed);
  return {m,d,dim,rest,gasHoy:a.gas,gasFin,ingHoy:a.ing,ingFin,netoFin:ingFin-gasFin,pend,pendT,varDia,base:prevMs.length};
}
// Colchón: efectivo de las cuentas entre el gasto medio de los últimos 12 meses cerrados (sin extraordinarios)
function colchon(){
  const cash=ACCS().reduce((t,a)=>t+(lastSaldo(a.id)?.saldo||0),0);
  const ms=C().months.filter(m=>m<thisMonth()&&aggOf(m).n).slice(-12);
  const g=ms.length?ms.reduce((t,m)=>t+gasSinX(aggOf(m)),0)/ms.length:0;
  return {cash,g,n:ms.length,meses:g>0?cash/g:null};
}
// Patrimonio al cierre de cada mes: saldo de cada cuenta + inversiones (precio guardado a esa fecha o coste)
const patEvoAll=()=>((S.cfg.ui||{}).patEvo)==="todo";
function patrimonioSerie(){
  if(PSER) return PSER;
  const c=C(), first=c.months[0]; if(!first) return null;
  const cm=thisMonth(), ms=[]; for(let m=first;m<=cm;m=addMonths(m,1)) ms.push(m);
  const end=m=>m===cm?today():endOfMonth(m);
  const accs=ACCS().map(a=>{ const L=(c.byAcc[a.id]||[]).filter(r=>r.saldo!=null); let i=-1; return {a,vals:ms.map(m=>{ const e=end(m); while(i+1<L.length&&L[i+1].f<=e) i++; return i>=0?L[i].saldo:0; })}; });
  const inv=ms.map(m=>m===cm?(etfStats().valor||0):(etfStats(end(m)).valor||0));
  const tot=ms.map((_,i)=>accs.reduce((t,x)=>t+x.vals[i],0)+inv[i]);
  PSER={ms,accs,inv,tot}; return PSER;
}
function deltaHTML(cur,prev,upBad,abs){
  if(!prev&&!cur) return `<span class="delta eq">—</span>`;
  if(!prev) return `<span class="delta eq">nuevo</span>`;
  const dd=abs?cur-prev:(cur-prev)/Math.abs(prev);
  if(Math.abs(dd)<(abs?0.5:0.0005)) return `<span class="delta eq">=</span>`;
  const up=dd>0; return `<span class="delta ${up===upBad?"bad":"good"}">${up?"▲":"▼"} ${abs?eur0(Math.abs(dd)):pct(Math.abs(dd))}</span>`;
}

const isImgFile=f=>/^image\//i.test(f.type||"")||/\.(png|jpe?g|webp|heic|heif)$/i.test(f.name||"");

const MES_N={ene:1,jan:1,feb:2,mar:3,abr:4,apr:4,may:5,jun:6,jul:7,ago:8,aug:8,sep:9,set:9,oct:10,nov:11,dic:12,dec:12};
async function shotsClaude(blobs){
  const out=[]; let banco="";
  for(let i=0;i<blobs.length;i+=4){
    const res=await sample.json(`Estas imágenes son capturas de pantalla de la app de un banco o bróker con una lista de movimientos. Extrae TODOS los movimientos visibles. Devuelve SOLO un objeto JSON: {"banco": "nombre del banco o app si se reconoce, o null", "movimientos": [{"fecha": "AAAA-MM-DD", "concepto": "texto del movimiento tal como aparece", "importe": -12.34}]}. Reglas: "importe" negativo para pagos, cargos y compras; positivo para ingresos y abonos; con punto decimal. Si la lista agrupa por días con cabeceras («Hoy», «Ayer», «14 oct»…), aplica esa fecha a los movimientos de debajo. Hoy es ${today()}; si falta el año, usa el más reciente que no sea futuro. No incluyas saldos, totales, ni filas repetidas por el desplazamiento entre capturas. Si no hay movimientos, devuelve la lista vacía.`,{images:blobs.slice(i,i+4),modelTier:"default"});
    if(res&&res.banco&&!banco) banco=String(res.banco);
    (res&&Array.isArray(res.movimientos)?res.movimientos:[]).forEach(m=>{ const imp=parseNum(m.importe), f=parseDate(m.fecha); if(imp!=null) out.push({f:f||today(),desc:String(m.concepto||"").trim()||"Movimiento",imp:Math.round(imp*100)/100}); }); }
  return {rows:out,banco};
}
// Prepara la captura para el OCR: escala de grises y, si es modo oscuro, colores invertidos
async function shotCanvas(file){
  const bmp=await createImageBitmap(file), k=Math.min(2,1800/bmp.width);
  const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
  const x=c.getContext("2d",{willReadFrequently:true}); x.drawImage(bmp,0,0,c.width,c.height);
  const im=x.getImageData(0,0,c.width,c.height), d=im.data; let sum=0;
  for(let i=0;i<d.length;i+=4){ const g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]; d[i]=d[i+1]=d[i+2]=g; sum+=g; }
  if(sum/(d.length/4)<110) for(let i=0;i<d.length;i+=4){ d[i]=d[i+1]=d[i+2]=255-d[i]; }
  x.putImageData(im,0,0); return c;
}
let TESS=null;
async function shotsLocal(files,prog){
  if(!window.Tesseract) await loadScript("tesseract","https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
  if(!TESS) TESS=await Tesseract.createWorker("spa",1,{logger:m=>{ if(prog&&m.status==="recognizing text") prog(m.progress); }});
  const rows=[];
  for(let i=0;i<files.length;i++){ prog&&prog(0,i+1,files.length); const {data}=await TESS.recognize(await shotCanvas(files[i])); rows.push(...parseShotText(data.text||"")); }
  return {rows,banco:""};
}
// Interpreta el texto de una captura: cabeceras de día, conceptos e importes
function parseShotText(txt){
  const lines=txt.split(/\n/).map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean), out=[], t=today();
  const AMT=/([+\-−–]\s?)?(\d{1,3}(?:[.\s]\d{3})+|\d+),(\d{2})(?!\d)\s?(€|EUR)?/g;
  const fix=(y,m,d)=>{ if(!(m>=1&&m<=12&&d>=1&&d<=31)) return null; let yy=y||+t.slice(0,4); if(yy<100) yy+=2000; let f=`${yy}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`; if(!y&&f>t) f=`${yy-1}${f.slice(4)}`; return f; };
  const dateIn=l=>{ const L=lo(l); let m;
    if(/\bhoy\b/.test(L)) return {f:t,re:/\bhoy\b/i}; if(/\bayer\b/.test(L)) return {f:(d=>{ d.setUTCDate(d.getUTCDate()-1); return d.toISOString().slice(0,10); })(new Date(t+"T12:00:00Z")),re:/\bayer\b/i};
    if((m=l.match(/\b(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})\b/))) return {f:fix(+m[3],+m[2],+m[1]),re:m[0]};
    if((m=L.match(/\b(\d{1,2})\s+(?:de\s+)?(ene|feb|mar|abr|may|jun|jul|ago|sep|set|oct|nov|dic|jan|apr|aug|dec)[a-z]*\.?(?:\s+(?:de\s+)?(\d{4}))?/))) return {f:fix(m[3]?+m[3]:0,MES_N[m[2]],+m[1]),re:new RegExp(m[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i")};
    return null; };
  let cur=null, pend="";
  for(const l of lines){
    const dt=dateIn(l), am=[...l.matchAll(AMT)];
    if(!am.length){ const rest=dt?l.replace(dt.re,"").replace(/[,·•\-]/g," ").replace(/\b(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)\b/ig,"").trim():l;
      if(dt&&dt.f&&rest.length<4) cur=dt.f; else { if(dt&&dt.f) cur=dt.f; if(rest.length>=3) pend=rest; } continue; }
    const a=am[am.length-1], v=+(a[2].replace(/[.\s]/g,"")+"."+a[3]);
    let desc=l; am.forEach(x=>desc=desc.replace(x[0]," ")); if(dt) desc=desc.replace(dt.re," ");
    desc=desc.replace(/[€|•·]/g," ").replace(/\s+/g," ").trim();
    if(desc.length<3) desc=pend||"Movimiento";
    if(/\b(saldo|balance|total|disponible)\b/i.test(desc)) { pend=""; continue; }
    const sg=a[1]?(/\+/.test(a[1])?1:-1):(/\b(abono|ingreso|recibid|n[oó]mina|devoluci[oó]n|bonus|inter[eé]s)/i.test(l)?1:-1);
    out.push({f:(dt&&dt.f)||cur||t,desc,imp:sg*v}); pend=""; }
  return out;
}

// Las capturas son altas: se reducen menos que las fotos de tickets para que el texto siga legible
async function shrinkShot(file){
  try{ const bmp=await createImageBitmap(file), k=Math.min(1,2400/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k); c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(res=>c.toBlob(res,"image/jpeg",0.85)); return b||file; }catch(e){ return file; }
}

// Suma de flujos entre dos meses contables; en el último mes, solo hasta el día dlim (para comparar tramos iguales)
function flowsBetween(m0,m1,dlim){ const a={ing:0,gas:0,aho:0}, sx=sinExtra();
  for(const r of S.rows){ const m=mesOf(r); if(m<m0||m>m1) continue; if(dlim&&m===m1&&r.f.slice(0,7)===m&&+r.f.slice(8,10)>dlim) continue;
    const fl=flujo(r); if(fl==="Gasto"){ if(r.extra&&sx) continue; a.gas-=r.imp; } else if(fl==="Ingreso") a.ing+=r.imp; else if(fl==="Ahorro/Inversión") a.aho-=r.imp; }
  a.neto=a.ing-a.gas; return a; }

  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,${H} ${pts} ${W},${H}" fill="var(--accent-soft)" stroke="none"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`; }

function drawInicio(){

  if(per==="mes"){
    const dayGas=(m,lim)=>{ const v=Array(daysIn(m)).fill(0); for(const r of S.rows){ if(mesOf(r)!==m||flujo(r)!=="Gasto"||(r.extra&&sinExtra())) continue; const dd=r.f.slice(0,7)===m?+r.f.slice(8,10):1; v[dd-1]-=r.imp; } let acc=0; return v.map((x,i)=>{ acc+=x; return lim&&i+1>lim?null:Math.round(acc*100)/100; }); };

function drawAhorro(){

function vLim(){
  const ms=C().months, m=limMonth(), a=aggOf(m);
  const prev=ms.filter(x=>x<m).slice(-3), avg=(c,s)=>prev.length?prev.reduce((t,x)=>t+(s?aggOf(x).G[c]?.[s]||0:aggOf(x).G[c]?._||0),0)/prev.length:null;
  const day=m===thisMonth()?new Date().getDate():null, dim=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
  const L=S.cfg.limits; let tl=0,tg=0,over=0;
  const line=(label,key,v,av,isSub)=>{ const lim=+L[key]||0; if(lim){tl+=isSub?0:lim; tg+=isSub?0:v; if(v>lim&&!isSub) over++;}
    const r=lim?v/lim:null, cls=r==null?"":r>1?"bad":r>=.8?"warn":""; const pr=day&&lim?v/day*dim:null;
    return `<tr class="${isSub?"sub-row":"cat-row"}"><td class="l-name drill" data-drill="${esc(key)}" data-mes="${m}" tabindex="0">${isSub?"":`<i class="sw" style="background:${catColor(label)}"></i>`}${esc(label)}</td>
     <td class="l-lim" style="width:130px"><input type="number" min="0" step="10" data-lim="${esc(key)}" value="${lim||""}" placeholder="—" aria-label="Límite de ${esc(label)}"></td>
     <td class="num l-gas">${eur0(v)}</td>
     <td class="l-prog" style="min-width:130px">${lim?`<div class="prog"><i class="${cls}" style="width:${Math.min(100,Math.max(0,r*100))}%"></i></div><div class="sub">${pct(r)}${lim>v?" · quedan "+eur0(lim-v):""}${pr&&pr>lim&&r<=1?` · <span style="color:var(--warn)">al ritmo actual ${eur0(pr)}</span>`:""}</div>`:""}</td>
     <td class="l-st">${!lim?`<span class="pill p-no">Sin límite</span>`:r>1?`<span class="pill p-bad">Excedido ${eur0(v-lim)}</span>`:r>=.8?`<span class="pill p-warn">Cerca</span>`:`<span class="pill p-ok">Dentro</span>`}</td>
     <td class="num sub l-avg">${av==null?"—":eur0(av)}${!lim&&av>0?` <button class="btn sm" data-useavg="${esc(key)}" data-v="${Math.ceil(av/10)*10}">Usar</button>`:""}</td></tr>`; };
  const rows=S.cfg.cats.filter(c=>c.t==="gasto").map(c=>line(c.n,c.n,a.G[c.n]?._||0,avg(c.n),false)+(S.limOpen&&S.limOpen[c.n]?c.subs.map(s=>line(s,c.n+"|"+s,a.G[c.n]?.[s]||0,avg(c.n,s),true)).join(""):"")+`<tr class="l-toggle"><td colspan="6" style="padding:2px 9px 6px"><button class="btn sm" data-limopen="${esc(c.n)}">${S.limOpen&&S.limOpen[c.n]?"Ocultar subcategorías":"Límites por subcategoría"}</button></td></tr>`).join("");
  return `<section class="view">
  <div class="row"><h2>Límites por categoría</h2><span class="spacer"></span>${extraSeg()}<span class="sub">${mLabel(m)}</span></div>
  <p class="lead">Cuánto quieres gastar como máximo cada mes por categoría o subcategoría, comparado con el gasto del mes contable y con tu media de los tres meses anteriores. Las devoluciones marcadas restan del gasto.</p>
  <div class="kpis"><div class="kpi"><b>${eur0(tl)}</b><span>Suma de límites de categoría</span></div><div class="kpi"><b>${eur0(tg)}</b><span>Gastado en esas categorías</span></div><div class="kpi"><b style="color:${over?"var(--bad)":"var(--ok)"}">${over}</b><span>Categorías por encima</span></div><div class="kpi"><b>${a.ing?eur0(a.ing-tl):"—"}</b><span>Ingresos del mes menos límites</span></div></div>
  <div class="tbl-wrap cards limtbl"><table><thead><tr><th>Categoría</th><th>Límite mensual (€)</th><th class="num">Gastado</th><th>Progreso</th><th>Estado</th><th class="num">Media 3 meses</th></tr></thead><tbody>${rows}</tbody></table></div>
  </section>`;
}

function vReglas(){
  const cf=S.cfg;
  const tipoLbl={gasto:"Gasto",ingreso:"Ingreso",excluido:"Excluido",ahorro:"Ahorro"};
  return `<section class="view">
  <div class="row"><div><h2>Reglas</h2><p class="lead">Todo lo que decide la categorización automática, editable sin tocar código. Las filas corregidas a mano o importadas del Excel maestro no se recategorizan.</p></div><span class="spacer"></span><button class="btn primary" id="reapply">Volver a aplicar las reglas</button></div>
  <div class="panel"><div class="row"><h3>Cuentas y bancos (${ACCS().length})</h3><span class="spacer"></span><button class="btn sm primary" id="acc-add">Añadir cuenta</button></div>
